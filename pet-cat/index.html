<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>撸猫 · Pet the Cat</title>
  <style>
    :root {
      --bg-page: #fbf5eb;
      --bg-gradient-top: #fffaf0;
      --bg-gradient-bottom: #f3e6d3;
      --card-bg: #fffdf8;
      --card-border: rgba(186, 152, 112, 0.24);
      --card-shadow: 0 14px 36px rgba(133, 96, 56, 0.12);
      --text-main: #4a3525;
      --text-sub: #8a705a;
      --accent: #f08a5d;
      --accent-soft: rgba(240, 138, 93, 0.16);
      --pink: #f27999;
      --trap: #e85d5d;
      --pill-bg: rgba(255, 252, 245, 0.85);
      --pill-active-bg: #4a3525;
      --pill-active-text: #fffaf2;
      --meter-track: rgba(138, 112, 90, 0.16);
      --toast-bg: rgba(74, 53, 37, 0.88);
      --toast-text: #fffaf2;
      --stage-blend: multiply;
    }

    body.night {
      --bg-page: #181622;
      --bg-gradient-top: #231f33;
      --bg-gradient-bottom: #14121d;
      --card-bg: #262236;
      --card-border: rgba(214, 198, 255, 0.14);
      --card-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
      --text-main: #f4ece1;
      --text-sub: #b3a7c4;
      --accent: #f5a276;
      --accent-soft: rgba(245, 162, 118, 0.18);
      --pink: #ff8fb1;
      --trap: #ff6b6b;
      --pill-bg: rgba(45, 40, 64, 0.86);
      --pill-active-bg: #f5a276;
      --pill-active-text: #1c1726;
      --meter-track: rgba(255, 255, 255, 0.14);
      --toast-bg: rgba(245, 162, 118, 0.94);
      --toast-text: #1c1726;
      --stage-blend: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-gradient-top) 0%, var(--bg-gradient-bottom) 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      transition: background 0.35s ease, color 0.35s ease;
    }

    .app {
      width: 100%;
      height: 100dvh;
      max-width: 520px;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .brand .heart-total {
      font-size: 13px;
      font-weight: 700;
      color: var(--pink);
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--pill-bg);
      color: var(--text-main);
      font-size: 17px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.25s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .icon-btn.muted {
      opacity: 0.5;
    }

    /* Meters */
    .meters {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .meter-card {
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 9px 12px;
      backdrop-filter: blur(8px);
    }

    .meter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .meter-row .sub {
      color: var(--text-sub);
      font-weight: 600;
    }

    .bar-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: var(--meter-track);
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.1s linear;
    }

    .bar-fill.affection {
      background: linear-gradient(90deg, #ffb085 0%, #f27999 100%);
    }

    .bar-fill.trap {
      background: linear-gradient(90deg, #f6c453 0%, #e85d5d 100%);
    }

    .trap-wrap {
      margin-top: 8px;
      display: none;
    }

    .trap-wrap.visible {
      display: block;
    }

    /* Main Stage */
    .stage-wrap {
      flex: 1;
      min-height: 240px;
      position: relative;
      border-radius: 28px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      overflow: hidden;
      touch-action: none;
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    body.night .stage-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, rgba(255, 232, 185, 0.12), transparent 65%);
      pointer-events: none;
    }

    canvas#catCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }

    canvas#catCanvas:active {
      cursor: grabbing;
    }

    /* Fallback blend when white-bg cutout is unavailable (e.g. file:// CORS) */
    canvas#catCanvas.blend-fallback {
      mix-blend-mode: var(--stage-blend);
    }

    /* Stage HUD overlays */
    .purr-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      pointer-events: none;
      opacity: 0.92;
    }

    .purr-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      transform: scale(0.75);
      transition: transform 0.12s ease, background 0.2s ease;
    }

    .fallback-note {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(240, 138, 93, 0.18);
      color: var(--text-main);
      pointer-events: none;
      display: none;
    }

    .fallback-note.visible {
      display: block;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%) translateY(14px);
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--toast-bg);
      color: var(--toast-text);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
      z-index: 5;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Paw Grab Animation Overlay */
    .grab-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      z-index: 4;
    }

    .grab-overlay.active {
      animation: grabFlash 1.05s ease forwards;
    }

    .paw {
      position: absolute;
      font-size: 64px;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.22));
    }

    .paw.left {
      left: 18%;
      transform: translateX(-80px) rotate(32deg);
    }

    .paw.right {
      right: 18%;
      transform: translateX(80px) rotate(-32deg) scaleX(-1);
    }

    .grab-overlay.active .paw.left {
      animation: pawClampLeft 0.95s cubic-bezier(0.22, 1.25, 0.36, 1) forwards;
    }

    .grab-overlay.active .paw.right {
      animation: pawClampRight 0.95s cubic-bezier(0.22, 1.25, 0.36, 1) forwards;
    }

    @keyframes grabFlash {
      0% { opacity: 0; background: rgba(232, 93, 93, 0); }
      15% { opacity: 1; background: rgba(232, 93, 93, 0.16); }
      75% { opacity: 1; background: rgba(232, 93, 93, 0.08); }
      100% { opacity: 0; background: rgba(232, 93, 93, 0); }
    }

    @keyframes pawClampLeft {
      0% { transform: translateX(-90px) rotate(38deg) scale(0.9); }
      22% { transform: translateX(26px) rotate(18deg) scale(1.12); }
      38% { transform: translateX(18px) rotate(24deg) scale(1.06); }
      54% { transform: translateX(26px) rotate(16deg) scale(1.1); }
      100% { transform: translateX(-70px) rotate(35deg) scale(0.9); }
    }

    @keyframes pawClampRight {
      0% { transform: translateX(90px) rotate(-38deg) scaleX(-1) scale(0.9); }
      22% { transform: translateX(-26px) rotate(-18deg) scaleX(-1) scale(1.12); }
      38% { transform: translateX(-18px) rotate(-24deg) scaleX(-1) scale(1.06); }
      54% { transform: translateX(-26px) rotate(-16deg) scaleX(-1) scale(1.1); }
      100% { transform: translateX(70px) rotate(-35deg) scaleX(-1) scale(0.9); }
    }

    .stage-wrap.shake {
      animation: stageShake 0.36s ease;
    }

    @keyframes stageShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px) rotate(-0.8deg); }
      40% { transform: translateX(7px) rotate(0.8deg); }
      60% { transform: translateX(-5px) rotate(-0.5deg); }
      80% { transform: translateX(4px) rotate(0.4deg); }
    }

    /* Tip line */
    .pose-tip {
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.4;
      flex-shrink: 0;
      min-height: 18px;
    }

    /* Bottom Pose Controls */
    .pose-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      flex-shrink: 0;
    }

    .pose-btn {
      border: 1px solid var(--card-border);
      background: var(--pill-bg);
      color: var(--text-main);
      border-radius: 16px;
      padding: 10px 6px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: background 0.22s ease, color 0.22s ease, transform 0.14s ease;
    }

    .pose-btn .mini {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.75;
    }

    .pose-btn.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      border-color: transparent;
    }

    .pose-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <h1>撸猫</h1>
        <span class="heart-total" id="heartTotal">♥ 0</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btnVibrate" aria-label="震动开关" title="震动反馈">📳</button>
        <button class="icon-btn" id="btnAudio" aria-label="声音开关" title="呼噜音效">🔊</button>
        <button class="icon-btn" id="btnTheme" aria-label="日夜切换" title="切换日夜模式">☀️</button>
      </div>
    </header>

    <section class="meters">
      <div class="meter-card">
        <div class="meter-row">
          <span>💖 亲密度</span>
          <span class="sub" id="affectionLabel">0%</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill affection" id="affectionFill"></div>
        </div>

        <div class="trap-wrap" id="trapWrap">
          <div class="meter-row" style="margin-top: 8px;">
            <span>🐾 肚皮陷阱值</span>
            <span class="sub" id="trapLabel">安全</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill trap" id="trapFill"></div>
          </div>
        </div>
      </div>
    </section>

    <main class="stage-wrap" id="stageWrap">
      <canvas id="catCanvas"></canvas>
      <div class="purr-badge">
        <span class="purr-dot" id="purrDot"></span>
        <span id="purrText">轻抚猫咪开始呼噜</span>
      </div>
      <div class="fallback-note" id="fallbackNote">占位图模式</div>
      <div class="grab-overlay" id="grabOverlay" aria-hidden="true">
        <span class="paw left">🐾</span>
        <span class="paw right">🐾</span>
      </div>
      <div class="toast" id="toast"></div>
    </main>

    <div class="pose-tip" id="poseTip">侧躺：从左向右顺毛撸背，逆毛会炸毛，还能轻拽右侧尾巴尖</div>

    <nav class="pose-nav" aria-label="猫咪姿势切换">
      <button class="pose-btn active" data-pose="side">
        <span>侧躺</span>
        <span class="mini">顺毛 / 拽尾巴</span>
      </button>
      <button class="pose-btn" data-pose="belly">
        <span>露肚皮</span>
        <span class="mini">摸肚皮陷阱</span>
      </button>
      <button class="pose-btn" data-pose="sit">
        <span>端坐</span>
        <span class="mini">挠下巴 / 捧脸杀</span>
      </button>
    </nav>
  </div>

      /* =========================================================
       * 3. Procedural WebAudio Cat Purr Synthesizer
       * ========================================================= */
      class PurrAudio {
        constructor() {
          this.ctx = null;
          this.ready = false;
          this.masterGain = null;
          this.filter = null;
          this.osc1 = null;
          this.osc2 = null;
          this.lfo = null;
        }

        unlock() {
          if (this.ready) {
            if (this.ctx && this.ctx.state === "suspended") {
              this.ctx.resume().catch(() => {});
            }
            return;
          }
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;

          try {
            const ac = new AudioCtx();
            this.ctx = ac;

            // Master output gain (controlled by purr level)
            const masterGain = ac.createGain();
            masterGain.gain.value = 0.0001;
            masterGain.connect(ac.destination);
            this.masterGain = masterGain;

            // Warm lowpass filter
            const lp = ac.createBiquadFilter();
            lp.type = "lowpass";
            lp.frequency.value = 220;
            lp.Q.value = 1.6;
            lp.connect(masterGain);
            this.filter = lp;

            // Breathing modulation (slow ~0.42Hz swell)
            const breathGain = ac.createGain();
            breathGain.gain.value = 0.72;
            breathGain.connect(lp);

            const breathLfo = ac.createOscillator();
            breathLfo.type = "sine";
            breathLfo.frequency.value = 0.42;
            const breathDepth = ac.createGain();
            breathDepth.gain.value = 0.28;
            breathLfo.connect(breathDepth);
            breathDepth.connect(breathGain.gain);
            breathLfo.start();

            // Purr rumble oscillators (~25Hz fundamental + ~50Hz overtone)
            const osc1 = ac.createOscillator();
            osc1.type = "sawtooth";
            osc1.frequency.value = 25.5;
            const osc1Gain = ac.createGain();
            osc1Gain.gain.value = 0.32;
            osc1.connect(osc1Gain);
            osc1Gain.connect(breathGain);
            osc1.start();
            this.osc1 = osc1;

            const osc2 = ac.createOscillator();
            osc2.type = "triangle";
            osc2.frequency.value = 51;
            const osc2Gain = ac.createGain();
            osc2Gain.gain.value = 0.18;
            osc2.connect(osc2Gain);
            osc2Gain.connect(breathGain);
            osc2.start();
            this.osc2 = osc2;

            // Filtered noise flutter modulated at 26Hz (authentic throat vibration)
            const bufSize = ac.sampleRate * 2;
            const noiseBuf = ac.createBuffer(1, bufSize, ac.sampleRate);
            const data = noiseBuf.getChannelData(0);
            let lastOut = 0;
            for (let i = 0; i < bufSize; i++) {
              const white = Math.random() * 2 - 1;
              lastOut = (lastOut + 0.04 * white) / 1.04;
              data[i] = lastOut * 3.2;
            }
            const noise = ac.createBufferSource();
            noise.buffer = noiseBuf;
            noise.loop = true;

            const noiseBp = ac.createBiquadFilter();
            noiseBp.type = "bandpass";
            noiseBp.frequency.value = 145;
            noiseBp.Q.value = 1.2;

            const flutterGain = ac.createGain();
            flutterGain.gain.value = 0.25;

            const flutterLfo = ac.createOscillator();
            flutterLfo.type = "sine";
            flutterLfo.frequency.value = 26;
            const flutterDepth = ac.createGain();
            flutterDepth.gain.value = 0.22;
            flutterLfo.connect(flutterDepth);
            flutterDepth.connect(flutterGain.gain);
            flutterLfo.start();
            this.lfo = flutterLfo;

            noise.connect(noiseBp);
            noiseBp.connect(flutterGain);
            flutterGain.connect(breathGain);
            noise.start();

            if (ac.state === "suspended") {
              ac.resume().catch(() => {});
            }
            this.ready = true;
          } catch (_) {
            // Audio blocked or unsupported
          }
        }

        update(purrLevel, muted) {
          if (!this.ready || !this.ctx || !this.masterGain) return;
          const now = this.ctx.currentTime;
          const targetVol = muted ? 0.0001 : Math.max(0.0001, purrLevel * 0.42);
          const targetFreq = 180 + purrLevel * 220;
          const targetRumble = 24.5 + purrLevel * 3.5;

          this.masterGain.gain.setTargetAtTime(targetVol, now, 0.08);
          this.filter.frequency.setTargetAtTime(targetFreq, now, 0.1);
          this.osc1.frequency.setTargetAtTime(targetRumble, now, 0.12);
          this.osc2.frequency.setTargetAtTime(targetRumble * 2, now, 0.12);
          this.lfo.frequency.setTargetAtTime(targetRumble + 0.5, now, 0.12);
        }

        playPop(pitch = 520, duration = 0.09) {
          if (!this.ready || !this.ctx || state.audioMuted) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(pitch, now);
          osc.frequency.exponentialRampToValueAtTime(pitch * 1.45, now + duration);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.01);
        }

        playBristle() {
          if (!this.ready || !this.ctx || state.audioMuted) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(290, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.14);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        }
      }

      const purrAudio = new PurrAudio();

      /* =========================================================
       * 4. Image Loading, White-BG Cutout & Fallback Placeholder
       * ========================================================= */
      function createFallbackCatCanvas(poseId) {
        const c = document.createElement("canvas");
        c.width = 520;
        c.height = 520;

        if (poseId === "side") {
          // Tail on right

          g.quadraticCurveTo(185, 10, 195, -55);

          g.stroke();
          g.lineWidth = 5;
          g.strokeStyle = stroke;
          g.stroke();

          // Body

          [-20, 15, 50].forEach(x => {

          });

          // Head on left

          g.stroke();

          // Ears
          [[-158, -62, -172, -118, -118, -82], [-86, -78, -68, -120, -56, -62]].forEach(pts => {
            g.fillStyle = bodyColor;

            g.moveTo(pts[0], pts[1]);
            g.lineTo(pts[2], pts[3]);
            g.lineTo(pts[4], pts[5]);

            g.fill();
            g.stroke();
          });

          // Closed happy eyes

          g.stroke();
          g.beginPath();
          g.arc(-92, -18, 10, Math.PI * 0.15, Math.PI * 0.85);
          g.stroke();

        } else if (poseId === "belly") {

          // Head

        } else {

          // Ears
          [[-64, -92, -88, -172, -18, -128], [64, -92, 88, -172, 18, -128]].forEach(pts => {

            g.lineTo(pts[2], pts[3]);

      function processLoadedImage(img) {
        const maxSide = 720;
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));

        const off = document.createElement("canvas");
        off.width = w;
        off.height = h;
        const octx = off.getContext("2d");
        octx.drawImage(img, 0, 0, w, h);

        let cutoutOk = false;
        try {
          const imgData = octx.getImageData(0, 0, w, h);
          const d = imgData.data;
          // Soft chroma-key removal for pure white studio backgrounds
          for (let i = 0; i < d.length; i += 4) {
            const r = d[i];
            const g = d[i + 1];
            const b = d[i + 2];
            const minC = Math.min(r, g, b);
            const maxC = Math.max(r, g, b);
            const sat = maxC - minC;
            if (minC > 240 && sat < 18) {
              d[i + 3] = 0;
            } else if (minC > 224 && sat < 24) {
              const t = (240 - minC) / 16;
              d[i + 3] = Math.round(d[i + 3] * Math.max(0, Math.min(1, t)));
            }
          }
          octx.putImageData(imgData, 0, 0);
          cutoutOk = true;
        } catch (_) {
          // Likely file:// origin taint; gracefully keep original image + CSS multiply fallback
          cutoutOk = false;
        }

        return { canvas: off, width: w, height: h, isFallback: false, cutoutOk };
      }

      function loadAllPoses() {
        Object.values(POSES).forEach(pose => {
          textures[pose.id] = createFallbackCatCanvas(pose.id);
          const img = new Image();
          img.onload = () => {
            textures[pose.id] = processLoadedImage(img);
            if (state.pose === pose.id) {
              updateStageLayout();
              syncTextureStatusUI();
            }
          };
          img.onerror = () => {
            if (state.pose === pose.id) {
              syncTextureStatusUI();
            }
          };
          img.src = pose.file;
        });
      }

      function syncTextureStatusUI() {
        const tex = textures[state.pose];
        if (!tex) return;
        fallbackNote.classList.toggle("visible", tex.isFallback);
        fallbackNote.textContent = tex.isFallback ? `未找到 ${POSES[state.pose].file}` : "";
        canvas.classList.toggle("blend-fallback", !tex.cutoutOk);
      }

      /* =========================================================
       * 5. Spring-Mass Mesh Grid (Jelly / Stretch / Bristle)
       * ========================================================= */
      const meshPoints = [];

      function initMesh() {
        meshPoints.length = 0;
        for (let r = 0; r <= GRID_ROWS; r++) {
          for (let c = 0; c <= GRID_COLS; c++) {
            meshPoints.push({
              uNorm: c / GRID_COLS,
              vNorm: r / GRID_ROWS,
              dx: 0,
              dy: 0,
              vx: 0,
              vy: 0
            });
          }
        }
      }

      function resetMeshMotion() {
        for (let i = 0; i < meshPoints.length; i++) {
          meshPoints[i].dx = 0;
          meshPoints[i].dy = 0;
          meshPoints[i].vx = 0;
          meshPoints[i].vy = 0;
        }
        state.headTilt = 0;
        state.headTiltTarget = 0;
        state.headTiltVel = 0;
      }

      function applyJellyImpulse(nx, ny, fx, fy, radius = 0.24, maxDisp = 34) {
        const r2 = radius * radius;
        for (let i = 0; i < meshPoints.length; i++) {
          const p = meshPoints[i];
          const ddx = p.uNorm - nx;
          const ddy = p.vNorm - ny;
          const dist2 = ddx * ddx + ddy * ddy;
          if (dist2 < r2 * 2.4) {
            const w = Math.exp(-dist2 / (2 * r2 * 0.45));
            p.dx = Math.max(-maxDisp, Math.min(maxDisp, p.dx + fx * w));
            p.dy = Math.max(-maxDisp, Math.min(maxDisp, p.dy + fy * w));
            p.vx += fx * w * 6.5;
            p.vy += fy * w * 6.5;
          }
        }
      }

      function applyTailStretch(nx, ny, pullX, pullY) {
        const clampedX = Math.max(-68, Math.min(76, pullX));
        const clampedY = Math.max(-62, Math.min(62, pullY));
        for (let i = 0; i < meshPoints.length; i++) {
          const p = meshPoints[i];
          if (p.uNorm > 0.64) {
            const tailWeight = Math.pow((p.uNorm - 0.64) / 0.36, 1.35);
            const vertFalloff = Math.exp(-Math.pow((p.vNorm - ny) / 0.34, 2));
            const w = tailWeight * vertFalloff;
            p.dx += (clampedX * w - p.dx) * 0.38;
            p.dy += (clampedY * w - p.dy) * 0.38;
            p.vx *= 0.65;
            p.vy *= 0.65;
          }
        }
      }

      function applyBristleBurst(nx, ny) {
        for (let i = 0; i < meshPoints.length; i++) {
          const p = meshPoints[i];
          const ddx = p.uNorm - nx;
          const ddy = p.vNorm - ny;
          const dist = Math.hypot(ddx, ddy);
          if (dist < 0.38) {
            const w = 1 - dist / 0.38;
            const angle = Math.atan2(ddy, ddx) + (Math.random() - 0.5) * 0.8;
            const kick = (160 + Math.random() * 140) * w;
            p.vx += Math.cos(angle) * kick;
            p.vy += Math.sin(angle) * kick - 120 * w;
          }
        }
      }

      function applyCheekSquish(p1, p2) {
        const midX = (p1.nx + p2.nx) * 0.5;
        const midY = (p1.ny + p2.ny) * 0.5;
        for (let i = 0; i < meshPoints.length; i++) {
          const p = meshPoints[i];
          const ddx = p.uNorm - midX;
          const ddy = p.vNorm - midY;
          const dist2 = ddx * ddx + ddy * ddy;
          if (dist2 < 0.24) {
            const w = Math.exp(-dist2 / 0.08);
            // Pull horizontally inward & slightly puff vertically
            const targetDx = -ddx * 72 * w;
            const targetDy = ddy * 24 * w;
            p.dx += (targetDx - p.dx) * 0.28;
            p.dy += (targetDy - p.dy) * 0.28;
          }
        }
      }

      function stepMesh(dt) {
        for (let i = 0; i < meshPoints.length; i++) {
          const p = meshPoints[i];
          const ax = -SPRING_K * p.dx - SPRING_DAMP * p.vx;
          const ay = -SPRING_K * p.dy - SPRING_DAMP * p.vy;
          p.vx += ax * dt;
          p.vy += ay * dt;
          p.dx += p.vx * dt;
          p.dy += p.vy * dt;
        }

        // Spring-damped head tilt for sit pose
        const tiltAcc = 120 * (state.headTiltTarget - state.headTilt) - 13 * state.headTiltVel;
        state.headTiltVel += tiltAcc * dt;
        state.headTilt += state.headTiltVel * dt;
        state.headTiltTarget *= Math.pow(0.08, dt);
      }

      /* =========================================================
       * 6. Affine Textured Triangle Mesh Renderer
       * ========================================================= */
      function drawTexturedTriangle(img, u0, v0, u1, v1, u2, v2, x0, y0, x1, y1, x2, y2) {
        const du1 = u1 - u0;
        const dv1 = v1 - v0;
        const du2 = u2 - u0;
        const dv2 = v2 - v0;
        const det = du1 * dv2 - du2 * dv1;
        if (Math.abs(det) < 1e-6) return;

        const dx1 = x1 - x0;
        const dy1 = y1 - y0;
        const dx2 = x2 - x0;
        const dy2 = y2 - y0;

        const a = (dx1 * dv2 - dx2 * dv1) / det;
        const b = (dy1 * dv2 - dy2 * dv1) / det;
        const c = (du1 * dx2 - du2 * dx1) / det;
        const d = (du1 * dy2 - du2 * dy1) / det;
        const e = x0 - a * u0 - c * v0;
        const f = y0 - b * u0 - d * v0;

        // Expand clip polygon slightly from centroid to prevent hairline seams
        const cx = (x0 + x1 + x2) / 3;
        const cy = (y0 + y1 + y2) / 3;
        const pad = 0.65;
        const ex = (x, y) => {
          const vx = x - cx;
          const vy = y - cy;
          const len = Math.hypot(vx, vy) || 1;
          return [x + (vx / len) * pad, y + (vy / len) * pad];
        };
        const [p0x, p0y] = ex(x0, y0);
        const [p1x, p1y] = ex(x1, y1);
        const [p2x, p2y] = ex(x2, y2);

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(p0x, p0y);
        ctx.lineTo(p1x, p1y);
        ctx.lineTo(p2x, p2y);
        ctx.closePath();
        ctx.clip();

        ctx.transform(a, b, c, d, e, f);
        ctx.drawImage(img, 0, 0);
        ctx.restore();
      }

      function renderCatMesh() {
        const tex = textures[state.pose];
        if (!tex) return;

        const { x, y, w, h } = state.imgBox;
        const imgW = tex.width;
        const imgH = tex.height;

        // Subtle idle breathing scale
        const breath = 1 + Math.sin(state.time * 2.2) * (0.008 + state.purr * 0.008);
        const cx = x + w * 0.5;
        const cy = y + h * 0.5;

        ctx.save();
        ctx.translate(cx, cy);
        if (state.pose === "sit") {
          ctx.rotate(state.headTilt);
        }
        ctx.scale(breath, 2 - breath);
        ctx.translate(-cx, -cy);

        const stride = GRID_COLS + 1;
        for (let r = 0; r < GRID_ROWS; r++) {
          for (let c = 0; c < GRID_COLS; c++) {
            const p00 = meshPoints[r * stride + c];
            const p10 = meshPoints[r * stride + (c + 1)];
            const p01 = meshPoints[(r + 1) * stride + c];
            const p11 = meshPoints[(r + 1) * stride + (c + 1)];

            const u00 = p00.uNorm * imgW, v00 = p00.vNorm * imgH;
            const u10 = p10.uNorm * imgW, v10 = p10.vNorm * imgH;
            const u01 = p01.uNorm * imgW, v01 = p01.vNorm * imgH;
            const u11 = p11.uNorm * imgW, v11 = p11.vNorm * imgH;

            const x00 = x + p00.uNorm * w + p00.dx, y00 = y + p00.vNorm * h + p00.dy;
            const x10 = x + p10.uNorm * w + p10.dx, y10 = y + p10.vNorm * h + p10.dy;
            const x01 = x + p01.uNorm * w + p01.dx, y01 = y + p01.vNorm * h + p01.dy;
            const x11 = x + p11.uNorm * w + p11.dx, y11 = y + p11.vNorm * h + p11.dy;

            drawTexturedTriangle(tex.canvas, u00, v00, u10, v10, u01, v01, x00, y00, x10, y10, x01, y01);
            drawTexturedTriangle(tex.canvas, u10, v10, u11, v11, u01, v01, x10, y10, x11, y11, x01, y01);
          }
        }

        // Rosy blush glow during 捧脸杀
        if (state.pose === "sit" && state.squishBoost > 0.02) {
          ctx.globalAlpha = state.squishBoost * 0.45;
          const drawBlush = (bx, by) => {
            const grad = ctx.createRadialGradient(bx, by, 4, bx, by, w * 0.14);
            grad.addColorStop(0, "#ff6b9d");
            grad.addColorStop(1, "rgba(255, 107, 157, 0)");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(bx, by, w * 0.14, 0, Math.PI * 2);
            ctx.fill();
          };
          drawBlush(x + w * 0.32, y + h * 0.42);
          drawBlush(x + w * 0.68, y + h * 0.42);
        }

        ctx.restore();
      }

      /* =========================================================
       * 7. Particles (Hearts, Sparkles, Bristle Bolts)
       * ========================================================= */
      function spawnParticle(sx, sy, type = "heart") {
        if (particles.length > 55) particles.shift();
        const symbols = {
          heart: ["💖", "💕", "💗", "❤️"],
          spark: ["⚡", "💢"],
          star: ["✨", "🌟"]
        };
        const pool = symbols[type] || symbols.heart;
        particles.push({
          x: sx + (Math.random() - 0.5) * 24,
          y: sy + (Math.random() - 0.5) * 16,
          vx: (Math.random() - 0.5) * (type === "spark" ? 110 : 42),
          vy: type === "spark" ? -(70 + Math.random() * 80) : -(48 + Math.random() * 52),
          size: type === "spark" ? 18 + Math.random() * 8 : 16 + Math.random() * 12,
          alpha: 1,
          life: 0,
          maxLife: type === "spark" ? 0.65 : 1.15 + Math.random() * 0.35,
          symbol: pool[Math.floor(Math.random() * pool.length)],
          wobble: Math.random() * Math.PI * 2
        });
      }

      function spawnBurst(sx, sy, count = 8, type = "heart") {
        for (let i = 0; i < count; i++) {
          spawnParticle(sx, sy, type);
        }
      }

      function updateAndRenderParticles(dt) {
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life += dt;
          if (p.life >= p.maxLife) {
            particles.splice(i, 1);
            continue;
          }
          const t = p.life / p.maxLife;
          p.x += (p.vx + Math.sin(state.time * 6 + p.wobble) * 18) * dt;
          p.y += p.vy * dt;
          p.alpha = 1 - Math.pow(t, 1.8);

          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.font = `${Math.round(p.size * (0.85 + Math.sin(t * Math.PI) * 0.25))}px sans-serif`;
          ctx.fillText(p.symbol, p.x, p.y);
        }
        ctx.restore();
      }

      /* =========================================================
       * 8. Gameplay Mechanics & Feedback
       * ========================================================= */
      function showToast(msg, duration = 1500) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        if (state.toastTimer) clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => {
          toastEl.classList.remove("show");
        }, duration);
      }

      function triggerVibrate(pattern) {
        if (!state.vibrateEnabled || typeof navigator.vibrate !== "function") return;
        try {
          navigator.vibrate(pattern);
        } catch (_) {}
      }

      function addAffection(delta, sx, sy) {
        state.affection = Math.max(0, Math.min(100, state.affection + delta));
        if (delta > 0 && Math.random() < 0.24) {
          spawnParticle(sx, sy, "heart");
        }
        if (state.affection >= 100) {
          onAffectionFull();
        }
      }

      function onAffectionFull() {
        const cur = POSES[state.pose];
        state.totalHearts += 1;
        heartTotalEl.textContent = `♥ ${state.totalHearts}`;
        state.affection = 0;
        state.trap = 0;

        spawnBurst(state.stageW * 0.5, state.stageH * 0.45, 14, "heart");
        spawnBurst(state.stageW * 0.5, state.stageH * 0.45, 6, "star");
        purrAudio.playPop(580, 0.12);
        triggerVibrate([30, 40, 45]);
        showToast(cur.switchMsg, 2200);

        switchPose(cur.next, false);
      }

      function triggerBellyGrab() {
        state.trap = 0;
        state.grabCooldown = 1.15;
        state.targetPurr = 0.08;
        state.affection = Math.max(0, state.affection - 8);

        // Squeeze mesh inward around belly center
        applyJellyImpulse(0.5, 0.52, 0, -18, 0.35, 30);
        applyBristleBurst(0.5, 0.55);

        grabOverlay.classList.remove("active");
        void grabOverlay.offsetWidth;
        grabOverlay.classList.add("active");

        stageWrap.classList.remove("shake");
        void stageWrap.offsetWidth;
        stageWrap.classList.add("shake");

        purrAudio.playBristle();
        triggerVibrate([45, 35, 65]);
        showToast("🐾 抓住你了！肚皮陷阱触发！", 1800);
        spawnBurst(state.stageW * 0.5, state.stageH * 0.52, 7, "spark");
      }

      function switchPose(poseId, announce = true) {
        if (!POSES[poseId]) return;
        state.pose = poseId;
        state.trap = 0;
        state.grabCooldown = 0;
        state.doubleTouchActive = false;
        resetMeshMotion();

        poseButtons.forEach(btn => {
          btn.classList.toggle("active", btn.dataset.pose === poseId);
        });
        poseTip.textContent = POSES[poseId].tip;
        trapWrap.classList.toggle("visible", poseId === "belly");

        updateStageLayout();
        syncTextureStatusUI();
        if (announce) {
          showToast(`切换姿势：${POSES[poseId].name}`, 1100);
        }
      }

      /* =========================================================
       * 9. Pointer / Multi-Touch Input Handling
       * ========================================================= */
      function getCanvasPoint(e) {
        const rect = canvas.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        const { x, y, w, h } = state.imgBox;
        const nx = (sx - x) / w;
        const ny = (sy - y) / h;
        return { sx, sy, nx, ny };
      }

      function isInsideCat(nx, ny) {
        return nx >= -0.08 && nx <= 1.08 && ny >= -0.08 && ny <= 1.08;
      }

      canvas.addEventListener("touchstart", e => {
        // Prevent iOS Safari zoom/scroll/selection on long press
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener("pointerdown", e => {
        purrAudio.unlock();
        const pt = getCanvasPoint(e);
        if (!isInsideCat(pt.nx, pt.ny)) return;

        const isTailStart = state.pose === "side" && pt.nx > 0.72 && pt.ny > 0.25 && pt.ny < 0.92;
        activePointers.set(e.pointerId, {
          id: e.pointerId,
          sx: pt.sx,
          sy: pt.sy,
          nx: pt.nx,
          ny: pt.ny,
          startSx: pt.sx,
          startSy: pt.sy,
          isTailDrag: isTailStart
        });

        applyJellyImpulse(pt.nx, pt.ny, 0, 8, 0.2, 22);

        if (state.pose === "sit" && activePointers.size >= 2) {
          state.doubleTouchActive = true;
          showToast("💕 捧脸杀！双倍呼噜~", 1300);
          spawnBurst(state.stageW * 0.5, state.stageH * 0.38, 6, "heart");
          purrAudio.playPop(640, 0.1);
        }
      });

      window.addEventListener("pointermove", e => {
        const prev = activePointers.get(e.pointerId);
        if (!prev) return;

        const pt = getCanvasPoint(e);
        const dx = pt.sx - prev.sx;
        const dy = pt.sy - prev.sy;
        const dist = Math.hypot(dx, dy);

        prev.sx = pt.sx;
        prev.sy = pt.sy;
        prev.nx = pt.nx;
        prev.ny = pt.ny;

        if (dist < 1.2) return;

        // Pose 1: Side-lying
        if (state.pose === "side") {
          if (prev.isTailDrag) {
            const pullX = pt.sx - prev.startSx;
            const pullY = pt.sy - prev.startSy;
            applyTailStretch(pt.nx, pt.ny, pullX, pullY);
            if (Math.hypot(pullX, pullY) > 28 && state.time - state.lastToastAt > 1.8) {
              state.lastToastAt = state.time;
              showToast("🐱 哎呀，别拽尾巴尖啦~", 1100);
            }
            return;
          }

          // Jelly push following finger
          applyJellyImpulse(pt.nx, pt.ny, dx * 0.52, dy * 0.52, 0.24, 32);

          // Check back stroking zone
          const onBack = pt.nx > 0.14 && pt.nx < 0.78 && pt.ny > 0.16 && pt.ny < 0.78;
          if (onBack && Math.abs(dx) > Math.abs(dy) * 0.55) {
            if (dx > 0.8) {
              // With the fur (顺毛: left -> right)
              const gain = Math.min(2.4, dist * 0.055);
              state.targetPurr = Math.min(1, state.targetPurr + dist * 0.014);
              addAffection(gain, pt.sx, pt.sy);
            } else if (dx < -1.8) {
              // Against the fur (逆毛: right -> left)
              state.targetPurr = Math.max(0, state.targetPurr - 0.12);
              state.affection = Math.max(0, state.affection - dist * 0.032);
              if (state.bristleCooldown <= 0) {
                state.bristleCooldown = 0.7;
                applyBristleBurst(pt.nx, pt.ny);
                spawnBurst(pt.sx, pt.sy, 5, "spark");
                purrAudio.playBristle();
                triggerVibrate([25, 25, 25]);
                showToast("⚡ 逆毛啦！猫咪炸毛了！", 1200);
              }
            }
          } else {
            // Gentle general petting
            state.targetPurr = Math.min(0.65, state.targetPurr + dist * 0.006);
            addAffection(dist * 0.018, pt.sx, pt.sy);
          }
          return;
        }

        // Pose 2: Belly-up
        if (state.pose === "belly") {
          applyJellyImpulse(pt.nx, pt.ny, dx * 0.58, dy * 0.58, 0.26, 34);
          if (state.grabCooldown > 0) return;

          const onBelly = pt.nx > 0.2 && pt.nx < 0.8 && pt.ny > 0.28 && pt.ny < 0.86;
          if (onBelly) {
            state.targetPurr = Math.min(1, state.targetPurr + dist * 0.015);
            addAffection(Math.min(2.2, dist * 0.048), pt.sx, pt.sy);
            state.trap = Math.min(100, state.trap + dist * 0.095);

            if (state.trap > 55 && state.trap < 62 && state.time - state.lastToastAt > 1.8) {
              state.lastToastAt = state.time;
              showToast("👀 肚皮好软…但后脚好像在蓄力", 1200);
            }
            if (state.trap >= 100) {
              triggerBellyGrab();
            }
          } else {
            state.targetPurr = Math.min(0.75, state.targetPurr + dist * 0.008);
            addAffection(dist * 0.024, pt.sx, pt.sy);
          }
          return;
        }

        // Pose 3: Sitting front
        if (state.pose === "sit") {
          if (activePointers.size >= 2) {
            state.doubleTouchActive = true;
            const pts = Array.from(activePointers.values());
            applyCheekSquish(pts[0], pts[1]);
            state.targetPurr = Math.min(1, state.targetPurr + dist * 0.026);
            addAffection(Math.min(3.6, dist * 0.09), pt.sx, pt.sy);
            if (Math.random() < 0.38) {
              spawnParticle((pts[0].sx + pts[1].sx) * 0.5, (pts[0].sy + pts[1].sy) * 0.5, "heart");
            }
          } else {
            applyJellyImpulse(pt.nx, pt.ny, dx * 0.45, dy * 0.45, 0.22, 26);
            const onFace = pt.nx > 0.16 && pt.nx < 0.84 && pt.ny > 0.12 && pt.ny < 0.66;
            if (onFace) {
              // Tilt head smoothly with chin/cheek rub
              const tiltDelta = (dx / state.stageW) * 1.1;
              state.headTiltTarget = Math.max(-0.24, Math.min(0.24, state.headTiltTarget + tiltDelta));
              state.targetPurr = Math.min(1, state.targetPurr + dist * 0.014);
              addAffection(Math.min(2.2, dist * 0.052), pt.sx, pt.sy);
            } else {
              state.targetPurr = Math.min(0.7, state.targetPurr + dist * 0.007);
              addAffection(dist * 0.02, pt.sx, pt.sy);
            }
          }
        }
      });

      function onPointerEnd(e) {
        if (!activePointers.has(e.pointerId)) return;
        const p = activePointers.get(e.pointerId);
        if (p && p.isTailDrag) {
          // Elastic snap-back feedback
          purrAudio.playPop(380, 0.07);
        }
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) {
          state.doubleTouchActive = false;
        }
      }

      window.addEventListener("pointerup", onPointerEnd);
      window.addEventListener("pointercancel", onPointerEnd);

      /* =========================================================
       * 10. UI Controls & Layout
       * ========================================================= */
      function updateStageLayout() {
        const rect = stageWrap.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
        state.stageW = Math.max(200, rect.width);
        state.stageH = Math.max(200, rect.height);

        canvas.width = Math.round(state.stageW * dpr);
        canvas.height = Math.round(state.stageH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const tex = textures[state.pose];
        const aspect = tex ? tex.width / tex.height : 1;
        const padW = state.stageW * 0.84;
        const padH = state.stageH * 0.80;

        let drawW = padW;
        let drawH = drawW / aspect;
        if (drawH > padH) {
          drawH = padH;
          drawW = drawH * aspect;
        }
        state.imgBox = {
          x: (state.stageW - drawW) * 0.5,
          y: (state.stageH - drawH) * 0.5 + 4,
          w: drawW,
          h: drawH
        };
      }

      poseButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          purrAudio.unlock();
          switchPose(btn.dataset.pose, true);
        });
      });

      btnTheme.addEventListener("click", () => {
        state.nightMode = !state.nightMode;
        document.body.classList.toggle("night", state.nightMode);
        btnTheme.textContent = state.nightMode ? "🌙" : "☀️";
      });

      btnAudio.addEventListener("click", () => {
        purrAudio.unlock();
        state.audioMuted = !state.audioMuted;
        btnAudio.textContent = state.audioMuted ? "🔇" : "🔊";
        btnAudio.classList.toggle("muted", state.audioMuted);
      });

      btnVibrate.addEventListener("click", () => {
        state.vibrateEnabled = !state.vibrateEnabled;
        btnVibrate.classList.toggle("muted", !state.vibrateEnabled);
        if (state.vibrateEnabled) triggerVibrate(20);
      });

      window.addEventListener("resize", updateStageLayout);

      /* =========================================================
       * 11. Main 60fps Loop
       * ========================================================= */
      let lastTs = performance.now();

      function tick(now) {
        const dt = Math.min(0.033, Math.max(0.001, (now - lastTs) / 1000));
        lastTs = now;
        state.time += dt;

        if (state.grabCooldown > 0) state.grabCooldown = Math.max(0, state.grabCooldown - dt);
        if (state.bristleCooldown > 0) state.bristleCooldown = Math.max(0, state.bristleCooldown - dt);

        // Hold gentle squish while two fingers stay pressed in sit pose
        if (state.pose === "sit" && activePointers.size >= 2) {
          const pts = Array.from(activePointers.values());
          applyCheekSquish(pts[0], pts[1]);
          state.targetPurr = Math.min(1, state.targetPurr + dt * 0.45);
          addAffection(dt * 12, (pts[0].sx + pts[1].sx) * 0.5, (pts[0].sy + pts[1].sy) * 0.5);
          state.squishBoost = Math.min(1, state.squishBoost + dt * 4);
        } else {
          state.squishBoost = Math.max(0, state.squishBoost - dt * 3);
        }

        // Decay purr smoothly when not actively petting
        if (activePointers.size === 0) {
          state.targetPurr = Math.max(0, state.targetPurr - dt * 0.32);
          if (state.pose === "belly" && state.trap > 0) {
            state.trap = Math.max(0, state.trap - dt * 6);
          }
        }
        state.purr += (state.targetPurr - state.purr) * Math.min(1, dt * 7);

        // Update WebAudio purr & optional Android vibration synced to purr
        purrAudio.update(state.purr, state.audioMuted);
        if (state.purr > 0.22 && now - state.lastVibrateAt > (390 - state.purr * 140)) {
          state.lastVibrateAt = now;
          triggerVibrate(Math.round(14 + state.purr * 18));
        }

        // Step physics
        stepMesh(dt);

        // Update HUD DOM
        affectionFill.style.width = `${state.affection.toFixed(1)}%`;
        affectionLabel.textContent = `${Math.round(state.affection)}%`;

        if (state.pose === "belly") {
          trapFill.style.width = `${state.trap.toFixed(1)}%`;
          trapLabel.textContent =
            state.trap < 35 ? "安全享受中" :
            state.trap < 75 ? "尾巴开始甩了…" : "危险！快收手！";
        }

        const pulseScale = 0.75 + state.purr * 0.55 + Math.sin(state.time * 18) * state.purr * 0.14;
        purrDot.style.transform = `scale(${pulseScale.toFixed(2)})`;
        purrDot.style.background = state.doubleTouchActive ? "var(--pink)" : "var(--accent)";
        if (state.doubleTouchActive) {
          purrText.textContent = "捧脸杀 · 双倍呼噜中";
        } else if (state.purr > 0.55) {
          purrText.textContent = "呼噜呼噜~~~ 超满足";
        } else if (state.purr > 0.18) {
          purrText.textContent = "微微呼噜中…";
        } else {
          purrText.textContent = "轻抚猫咪开始呼噜";
        }

        // Render frame
        ctx.clearRect(0, 0, state.stageW, state.stageH);
        renderCatMesh();
        updateAndRenderParticles(dt);

        requestAnimationFrame(tick);
      }

      /* =========================================================
       * 12. Boot
       * ========================================================= */
      initMesh();
      loadAllPoses();
      updateStageLayout();
      syncTextureStatusUI();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
