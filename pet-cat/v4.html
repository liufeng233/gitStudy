<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>撸猫 · Pet the Cat</title>
  <style>
    :root {
      --bg-page: #fbf5eb;
      --bg-gradient-top: #fffaf0;
      --bg-gradient-bottom: #f3e6d3;
      --card-bg: #f6ecdc;
      --card-border: rgba(186, 152, 112, 0.28);
      --card-shadow: 0 14px 36px rgba(133, 96, 56, 0.14);
      --text-main: #4a3525;
      --text-sub: #8a705a;
      --accent: #f08a5d;
      --pink: #f27999;
      --trap: #e85d5d;
      --pill-bg: rgba(255, 252, 245, 0.86);
      --pill-active-bg: #4a3525;
      --pill-active-text: #fffaf2;
      --meter-track: rgba(138, 112, 90, 0.16);
      --toast-bg: rgba(74, 53, 37, 0.88);
      --toast-text: #fffaf2;
    }

    body.night {
      --bg-page: #14182a;
      --bg-gradient-top: #1a2038;
      --bg-gradient-bottom: #101424;
      --card-bg: #181e34;
      --card-border: rgba(164, 186, 255, 0.18);
      --card-shadow: 0 18px 42px rgba(0, 0, 0, 0.52);
      --text-main: #eef1fa;
      --text-sub: #a8b2d1;
      --accent: #f5a276;
      --pink: #ff8fb1;
      --trap: #ff6b6b;
      --pill-bg: rgba(28, 35, 62, 0.86);
      --pill-active-bg: #f5a276;
      --pill-active-text: #161b2e;
      --meter-track: rgba(255, 255, 255, 0.14);
      --toast-bg: rgba(245, 162, 118, 0.94);
      --toast-text: #161b2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-gradient-top) 0%, var(--bg-gradient-bottom) 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      transition: background 0.35s ease, color 0.35s ease;
    }

    .app {
      width: 100%;
      height: 100dvh;
      max-width: 520px;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .brand .heart-total {
      font-size: 13px;
      font-weight: 700;
      color: var(--pink);
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--pill-bg);
      color: var(--text-main);
      font-size: 17px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.25s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .icon-btn.muted {
      opacity: 0.5;
    }

    /* Meters */
    .meters {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .meter-card {
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 9px 12px;
      backdrop-filter: blur(8px);
    }

    .meter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .meter-row .sub {
      color: var(--text-sub);
      font-weight: 600;
    }

    .bar-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: var(--meter-track);
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.1s linear;
    }

    .bar-fill.affection {
      background: linear-gradient(90deg, #ffb085 0%, #f27999 100%);
    }

    .bar-fill.trap {
      background: linear-gradient(90deg, #f6c453 0%, #e85d5d 100%);
    }

    .trap-wrap {
      margin-top: 8px;
      display: none;
    }

    .trap-wrap.visible {
      display: block;
    }

    /* Main Stage */
    .stage-wrap {
      flex: 1;
      min-height: 250px;
      position: relative;
      border-radius: 28px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      overflow: hidden;
      touch-action: none;
      transition: border-color 0.35s ease;
    }

    canvas#catCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
      transition: filter 0.35s ease;
    }

    canvas#catCanvas.hand-active {
      cursor: none;
    }

    body.night canvas#catCanvas {
      filter: brightness(0.86);
    }

    /* Stage HUD overlays */
    .purr-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(6px);
      pointer-events: none;
      opacity: 0.94;
      z-index: 3;
    }

    .purr-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      transform: scale(0.75);
      transition: transform 0.12s ease, background 0.2s ease;
    }

    .fallback-note {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(240, 138, 93, 0.24);
      color: var(--text-main);
      backdrop-filter: blur(4px);
      pointer-events: none;
      display: none;
      z-index: 3;
    }

    .fallback-note.visible {
      display: block;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%) translateY(14px);
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--toast-bg);
      color: var(--toast-text);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      z-index: 5;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Paw Grab Animation Overlay */
    .grab-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      z-index: 4;
    }

    .grab-overlay.active {
      animation: grabFlash 1.05s ease forwards;
    }

    .paw {
      position: absolute;
      font-size: 64px;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.25));
    }

    .paw.left {
      left: 18%;
      transform: translateX(-80px) rotate(32deg);
    }

    .paw.right {
      right: 18%;
      transform: translateX(80px) rotate(-32deg) scaleX(-1);
    }

    .grab-overlay.active .paw.left {
      animation: pawClampLeft 0.95s cubic-bezier(0.22, 1.25, 0.36, 1) forwards;
    }

    .grab-overlay.active .paw.right {
      animation: pawClampRight 0.95s cubic-bezier(0.22, 1.25, 0.36, 1) forwards;
    }

    @keyframes grabFlash {
      0% { opacity: 0; background: rgba(232, 93, 93, 0); }
      15% { opacity: 1; background: rgba(232, 93, 93, 0.18); }
      75% { opacity: 1; background: rgba(232, 93, 93, 0.08); }
      100% { opacity: 0; background: rgba(232, 93, 93, 0); }
    }

    @keyframes pawClampLeft {
      0% { transform: translateX(-90px) rotate(38deg) scale(0.9); }
      22% { transform: translateX(26px) rotate(18deg) scale(1.12); }
      38% { transform: translateX(18px) rotate(24deg) scale(1.06); }
      54% { transform: translateX(26px) rotate(16deg) scale(1.1); }
      100% { transform: translateX(-70px) rotate(35deg) scale(0.9); }
    }

    @keyframes pawClampRight {
      0% { transform: translateX(90px) rotate(-38deg) scaleX(-1) scale(0.9); }
      22% { transform: translateX(-26px) rotate(-18deg) scaleX(-1) scale(1.12); }
      38% { transform: translateX(-18px) rotate(-24deg) scaleX(-1) scale(1.06); }
      54% { transform: translateX(-26px) rotate(-16deg) scaleX(-1) scale(1.1); }
      100% { transform: translateX(70px) rotate(-35deg) scaleX(-1) scale(0.9); }
    }

    .stage-wrap.shake {
      animation: stageShake 0.36s ease;
    }

    @keyframes stageShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px) rotate(-0.8deg); }
      40% { transform: translateX(7px) rotate(0.8deg); }
      60% { transform: translateX(-5px) rotate(-0.5deg); }
      80% { transform: translateX(4px) rotate(0.4deg); }
    }

    /* Tip line */
    .pose-tip {
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.4;
      flex-shrink: 0;
      min-height: 18px;
    }

    /* Bottom Pose Controls */
    .pose-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      flex-shrink: 0;
    }

    .pose-btn {
      border: 1px solid var(--card-border);
      background: var(--pill-bg);
      color: var(--text-main);
      border-radius: 16px;
      padding: 10px 6px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: background 0.22s ease, color 0.22s ease, transform 0.14s ease;
    }

    .pose-btn .mini {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.75;
    }

    .pose-btn.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      border-color: transparent;
    }

    .pose-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <h1>撸猫</h1>
        <span class="heart-total" id="heartTotal">♥ 0</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btnVibrate" aria-label="震动开关" title="震动反馈">📳</button>
        <button class="icon-btn" id="btnAudio" aria-label="声音开关" title="呼噜音效">🔊</button>
        <button class="icon-btn" id="btnTheme" aria-label="日夜切换" title="切换日夜模式">☀️</button>
      </div>
    </header>

    <section class="meters">
      <div class="meter-card">
        <div class="meter-row">
          <span>💖 亲密度</span>
          <span class="sub" id="affectionLabel">0%</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill affection" id="affectionFill"></div>
        </div>

        <div class="trap-wrap" id="trapWrap">
          <div class="meter-row" style="margin-top: 8px;">
            <span>🐾 肚皮陷阱值</span>
            <span class="sub" id="trapLabel">安全</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill trap" id="trapFill"></div>
          </div>
        </div>
      </div>
    </section>

    <main class="stage-wrap" id="stageWrap">
      <canvas id="catCanvas"></canvas>
      <div class="purr-badge">
        <span class="purr-dot" id="purrDot"></span>
        <span id="purrText">轻抚猫咪开始呼噜</span>
      </div>
      <div class="fallback-note" id="fallbackNote">占位图模式</div>
      <div class="grab-overlay" id="grabOverlay" aria-hidden="true">
        <span class="paw left">🐾</span>
        <span class="paw right">🐾</span>
      </div>
      <div class="toast" id="toast"></div>
    </main>

    <div class="pose-tip" id="poseTip">侧躺：从左向右顺毛撸背，逆毛会炸毛，还能轻拽右侧尾巴尖</div>

    <nav class="pose-nav" aria-label="猫咪姿势切换">
      <button class="pose-btn active" data-pose="side">
        <span>侧躺</span>
        <span class="mini">顺毛 / 拽尾巴</span>
      </button>
      <button class="pose-btn" data-pose="belly">
        <span>露肚皮</span>
        <span class="mini">摸肚皮陷阱</span>
      </button>
      <button class="pose-btn" data-pose="sit">
        <span>端坐</span>
        <span class="mini">挠下巴 / 捧脸杀</span>
      </button>
    </nav>
  </div>

      /* =========================================================
       * 3. Realistic Procedural AudioBuffer Purr + Trigger Sounds
       * ========================================================= */
      class PurrAudio {
        constructor() {
          this.ctx = null;
          this.ready = false;
          this.purrGain = null;
          this.purrSource = null;
        }

        buildPurrBuffer(ac) {
          const sampleRate = ac.sampleRate;
          const duration = 4.0; // 4-second seamless loop
          const totalSamples = Math.floor(sampleRate * duration);
          const buffer = ac.createBuffer(1, totalSamples, sampleRate);
          const out = buffer.getChannelData(0);

          // 22 Hz pulse train -> 88 exact cycles in 4.0s for seamless looping
          const pulseHz = 22.0;
          const pulseSamples = sampleRate / pulseHz;

          // 2nd-order RBJ bandpass filter centered at ~660Hz (400-1000Hz band)
          const f0 = 660;
          const Q = 1.05;
          const w0 = (2 * Math.PI * f0) / sampleRate;
          const alpha = Math.sin(w0) / (2 * Q);
          const a0 = 1 + alpha;
          const b0 = alpha / a0;
          const b1 = 0;
          const b2 = -alpha / a0;
          const a1 = (-2 * Math.cos(w0)) / a0;
          const a2 = (1 - alpha) / a0;

          let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
          let maxAbs = 0.001;

          // Warm up filter state slightly to avoid edge transient at t=0
          for (let i = 0; i < 256; i++) {
            const x0 = Math.random() * 2 - 1;
            const y0 = b0 * x0 + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
            x2 = x1; x1 = x0; y2 = y1; y1 = y0;
          }

          for (let i = 0; i < totalSamples; i++) {
            const t = i / sampleRate;
            const pulsePhase = (i % pulseSamples) / pulseSamples; // 0..1 inside each ~45ms pulse

            // Fast attack (first 12%), fast exponential decay
            const attack = Math.min(1, pulsePhase / 0.12);
            const decay = Math.exp(-pulsePhase * 4.4);
            const pulseEnv = attack * decay;

            // Bandpass filtered noise (400-1000Hz) for crisp phone-speaker audibility
            const x0 = Math.random() * 2 - 1;
            const bpNoise = b0 * x0 + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
            x2 = x1; x1 = x0; y2 = y1; y1 = bpNoise;

            // 52Hz low sine thump synced to each pulse
            const lowThump = Math.sin(2 * Math.PI * 52 * t) * 0.34;

            // Breathing modulation (~0.25-0.28Hz; 1 exact seamless cycle across 4s)
            // Inhale half slightly softer (~0.56), exhale half stronger (~1.0)
            const breathPhase = t / duration; // 0..1
            const breathEnv = 0.78 - 0.22 * Math.cos(2 * Math.PI * breathPhase) + 0.08 * Math.sin(2 * Math.PI * breathPhase);

            const sample = (bpNoise * 2.45 + lowThump) * pulseEnv * breathEnv;
            out[i] = sample;
            const a = Math.abs(sample);
            if (a > maxAbs) maxAbs = a;
          }

          // Normalize cleanly to ~0.9 peak
          const norm = 0.9 / maxAbs;
          for (let i = 0; i < totalSamples; i++) {
            out[i] *= norm;
          }
          return buffer;
        }

        unlock() {
          if (this.ready) {
            if (this.ctx && this.ctx.state === "suspended") {
              this.ctx.resume().catch(() => {});
            }
            return;
          }
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;

          try {
            const ac = new AudioCtx();
            this.ctx = ac;

            const purrBuf = this.buildPurrBuffer(ac);
            const src = ac.createBufferSource();
            src.buffer = purrBuf;
            src.loop = true;

            const gain = ac.createGain();
            gain.gain.value = 0.0001;

            src.connect(gain);
            gain.connect(ac.destination);
            src.start(0);

            this.purrSource = src;
            this.purrGain = gain;

            if (ac.state === "suspended") {
              ac.resume().catch(() => {});
            }
            this.ready = true;
          } catch (_) {}
        }

        update(purrLevel, muted) {
          if (!this.ready || !this.ctx || !this.purrGain) return;
          const now = this.ctx.currentTime;
          // Peak gain up to 0.50 so mobile speakers hear the mid-band purr clearly
          const targetVol = muted ? 0.0001 : Math.max(0.0001, Math.pow(purrLevel, 0.85) * 0.50);
          this.purrGain.gain.setTargetAtTime(targetVol, now, 0.08);
        }

        // Short <= 0.24s "喵呜/呼噜噜" trigger sound (noise + pitch glide)
        playChirp(type = "switch") {
          if (!this.ready || !this.ctx || state.audioMuted) return;
          const ac = this.ctx;
          const now = ac.currentTime;
          const dur = type === "trap" ? 0.22 : 0.23;

          // Pitch glide voice
          const osc = ac.createOscillator();
          const vGain = ac.createGain();
          osc.type = type === "trap" ? "sawtooth" : "triangle";

          const lp = ac.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.value = type === "trap" ? 1450 : 1200;

          if (type === "trap") {
            osc.frequency.setValueAtTime(660, now);
            osc.frequency.exponentialRampToValueAtTime(380, now + 0.11);
            osc.frequency.exponentialRampToValueAtTime(520, now + dur);
          } else {
            osc.frequency.setValueAtTime(460, now);
            osc.frequency.exponentialRampToValueAtTime(760, now + 0.11);
            osc.frequency.exponentialRampToValueAtTime(580, now + dur);
          }

          vGain.gain.setValueAtTime(0.001, now);
          vGain.gain.linearRampToValueAtTime(type === "trap" ? 0.18 : 0.16, now + 0.025);
          vGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          osc.connect(lp);
          lp.connect(vGain);
          vGain.connect(ac.destination);
          osc.start(now);
          osc.stop(now + dur + 0.02);

          // Short breathy noise puff
          const nLen = Math.floor(ac.sampleRate * dur);
          const nBuf = ac.createBuffer(1, nLen, ac.sampleRate);
          const nd = nBuf.getChannelData(0);
          for (let i = 0; i < nLen; i++) {
            nd[i] = (Math.random() * 2 - 1) * Math.sin((i / nLen) * Math.PI);
          }
          const nSrc = ac.createBufferSource();
          nSrc.buffer = nBuf;
          const bp = ac.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.value = type === "trap" ? 1100 : 820;
          bp.Q.value = 1.6;
          const nGain = ac.createGain();
          nGain.gain.setValueAtTime(0.14, now);
          nGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          nSrc.connect(bp);
          bp.connect(nGain);
          nGain.connect(ac.destination);
          nSrc.start(now);
        }

        playBristle() {
          if (!this.ready || !this.ctx || state.audioMuted) return;
          const ac = this.ctx;
          const now = ac.currentTime;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        }
      }

      /* =========================================================
       * 4. Image Loading (Transparent Cutouts + Scene + Hand)
       * ========================================================= */
      function computeCellOpaque(imgData, w, h) {
        const mask = new Uint8Array(GRID_COLS * GRID_ROWS);
        const d = imgData.data;
        for (let r = 0; r < GRID_ROWS; r++) {
          const y0 = Math.floor((r / GRID_ROWS) * h);
          const y1 = Math.min(h - 1, Math.ceil(((r + 1) / GRID_ROWS) * h));
          for (let c = 0; c < GRID_COLS; c++) {
            const x0 = Math.floor((c / GRID_COLS) * w);
            const x1 = Math.min(w - 1, Math.ceil(((c + 1) / GRID_COLS) * w));
            let opaque = 0;
            for (let y = y0; y <= y1 && !opaque; y += 2) {
              for (let x = x0; x <= x1; x += 2) {
                if (d[(y * w + x) * 4 + 3] > 6) {
                  opaque = 1;
                  break;
                }
              }
            }
            mask[r * GRID_COLS + c] = opaque;
          }
        }
        return mask;
      }

      function createFallbackCatCanvas(poseId) {
        const dims = poseId === "side" ? [600, 180] : poseId === "belly" ? [600, 228] : [360, 460];
        const c = document.createElement("canvas");
        c.width = dims[0];
        c.height = dims[1];
        const g = c.getContext("2d");

        g.fillStyle = "#e8c49e";
        g.strokeStyle = "#6e4e37";
        g.lineWidth = 5;
        g.beginPath();
        g.ellipse(dims[0] * 0.45, dims[1] * 0.55, dims[0] * 0.36, dims[1] * 0.34, 0, 0, Math.PI * 2);
        g.fill();
        g.stroke();

        const cellOpaque = computeCellOpaque(g.getImageData(0, 0, c.width, c.height), c.width, c.height);
        return { source: c, width: c.width, height: c.height, isFallback: true, cellOpaque };
      }

      function prepareCutoutTexture(img) {
        const maxSide = 680;
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));

        const off = document.createElement("canvas");
        off.width = w;
        off.height = h;
        const octx = off.getContext("2d");
        octx.clearRect(0, 0, w, h);
        octx.drawImage(img, 0, 0, w, h);

        let cellOpaque = null;
        try {
          const imgData = octx.getImageData(0, 0, w, h);
          cellOpaque = computeCellOpaque(imgData, w, h);
        } catch (_) {
          // If file:// origin blocks getImageData, still render cleanly without culling
          cellOpaque = null;
        }
        return { source: off, width: w, height: h, isFallback: false, cellOpaque };
      }

      function loadAllAssets() {
        // Scene background
        const bg = new Image();
        bg.onload = () => {
          bgAsset.img = bg;
          bgAsset.loaded = true;
        };
        bg.src = ASSETS.bg;

        // Realistic hand
        const hand = new Image();
        hand.onload = () => {
          handAsset.img = hand;
          handAsset.width = hand.naturalWidth || 500;
          handAsset.height = hand.naturalHeight || 833;
          handAsset.loaded = true;
        };
        hand.src = ASSETS.hand;

        // Cutout cat poses
        Object.values(POSES).forEach(pose => {
          textures[pose.id] = createFallbackCatCanvas(pose.id);
          const img = new Image();
          img.onload = () => {
            textures[pose.id] = prepareCutoutTexture(img);
            if (state.pose === pose.id) {
              updateStageLayout();
              syncTextureStatusUI();
            }
          };
          img.onerror = () => {
            if (state.pose === pose.id) syncTextureStatusUI();
          };
          img.src = pose.file;
        });
      }

      function syncTextureStatusUI() {
        const tex = textures[state.pose];
        if (!tex) return;
        fallbackNote.classList.toggle("visible", tex.isFallback);
        fallbackNote.textContent = tex.isFallback ? `未找到 ${POSES[state.pose].file}` : "";
      }

      /* =========================================================
       * 5. 20x20 Mesh + Living Idle Layer + Tail Slow Recovery
       * ========================================================= */
      const meshPoints = [];

      function initMesh() {
        meshPoints.length = 0;
        for (let r = 0; r <= GRID_ROWS; r++) {
          for (let c = 0; c <= GRID_COLS; c++) {
            meshPoints.push({
              uNorm: c / GRID_COLS,
              vNorm: r / GRID_ROWS,
              tx: 0,
              ty: 0,
              touchW: 0,
              dx: 0,
              dy: 0,
              vx: 0,
              vy: 0,
              slow: false // Tail vertices use slow exponential uncurl recovery
            });
          }
        }
      }

      function tagTailVerticesForPose() {
        const pose = POSES[state.pose];
        const reg = pose.regions;
        for (let i = 0; i < meshPoints.length; i++) {
          const p = meshPoints[i];
          if (state.pose === "side") {
            p.slow = p.uNorm >= reg.tailStartX;
          } else if (state.pose === "belly") {
            p.slow = p.uNorm >= reg.tailStartX;
          } else {
            p.slow = p.uNorm >= reg.tailZoneX[0] && p.uNorm <= reg.tailZoneX[1] && p.vNorm >= reg.tailZoneY[0];
          }
        }
      }

      function resetMeshMotion() {
        for (let i = 0; i < meshPoints.length; i++) {
          const p = meshPoints[i];
          p.tx = 0;
          p.ty = 0;
          p.touchW = 0;
          p.dx = 0;
          p.dy = 0;
          p.vx = 0;
          p.vy = 0;
        }
        state.headTilt = 0;
        state.headTiltTarget = 0;
        state.headTiltVel = 0;
        state.tailWasDragged = false;
        state.tailCurlAmp = 0;
        state.tailReleaseAt = -20;
        tagTailVerticesForPose();
      }

      function isTailActivelyDragged() {
        let dragging = false;
        activePointers.forEach(ptr => {
          if (ptr.isTailDrag) dragging = true;
        });
        return dragging;
      }

      function computeTargetDeformation() {
        const W = state.imgBox.w;
        const H = state.imgBox.h;
        const pose = POSES[state.pose];
        const reg = pose.regions;

        for (let i = 0; i < meshPoints.length; i++) {
          meshPoints[i].tx = 0;
          meshPoints[i].ty = 0;
          meshPoints[i].touchW = 0;
        }

        /* --- A. Touch-Driven Deformation --- */
        if (activePointers.size > 0) {
          if (state.pose === "sit" && activePointers.size >= 2) {
            const pts = Array.from(activePointers.values());
            const midX = (pts[0].nx + pts[1].nx) * 0.5;
            const midY = (pts[0].ny + pts[1].ny) * 0.5;
            for (let i = 0; i < meshPoints.length; i++) {
              const p = meshPoints[i];
              const ddx = p.uNorm - midX;
              const ddy = p.vNorm - midY;
              const dist2 = ddx * ddx + ddy * ddy;
              if (dist2 < 0.36) {
                const w = Math.exp(-dist2 / 0.11);
                p.tx += -ddx * (0.42 * W) * w;
                p.ty += ddy * (0.18 * H) * w;
                p.touchW = Math.max(p.touchW, w);
              }
            }
          } else {
            activePointers.forEach(ptr => {
              // Tail drag stretch (>= 1.4x visible stretch)
              if (state.pose === "side" && ptr.isTailDrag) {
                const rawPullX = ptr.sx - ptr.startSx;
                const rawPullY = ptr.sy - ptr.startSy;
                const pullX = Math.max(-0.42 * W, Math.min(0.62 * W, rawPullX * 1.48));
                const pullY = Math.max(-0.48 * H, Math.min(0.48 * H, rawPullY * 1.38));
                const stretchMag = Math.hypot(pullX, pullY) / Math.max(1, W);
                const tStart = reg.tailStartX;
                const tSpan = Math.max(0.1, 1 - tStart);

                for (let i = 0; i < meshPoints.length; i++) {
                  const p = meshPoints[i];
                  if (p.uNorm >= tStart) {
                    const tailT = (p.uNorm - tStart) / tSpan;
                    const alongW = Math.pow(tailT, 1.12);
                    const vertW = Math.exp(-Math.pow((p.vNorm - reg.tailY) / 0.45, 2));
                    const w = alongW * (0.35 + 0.65 * vertW);
                    p.tx += pullX * w;
                    p.ty += pullY * w;
                    p.ty += (reg.tailY - p.vNorm) * (0.12 * H) * stretchMag * alongW;
                    p.touchW = Math.max(p.touchW, Math.min(1, alongW * 1.4));
                  }
                }
                return;
              }

              // Sustained Press-and-Hold Dent + Side Bulge + Drag Wave
              const fx = ptr.nx;
              const fy = ptr.ny;
              const dentDepth = 0.145 * H;
              const bulgeHoriz = 0.068 * W;
              const bulgeUp = 0.036 * H;
              const dentSigma2 = 2 * 0.185 * 0.185;

              const waveStrength = ptr.dragMix;
              const dirX = ptr.dirX;
              const dirY = ptr.dirY;
              const aheadX = fx + dirX * 0.11;
              const aheadY = fy + dirY * 0.11;
              const wavePushX = dirX * (0.078 * W) * waveStrength;
              const wavePushY = (dirY * (0.045 * H) - 0.062 * H) * waveStrength;
              const waveSigma2 = 2 * 0.145 * 0.145;

              for (let i = 0; i < meshPoints.length; i++) {
                const p = meshPoints[i];
                const ddx = p.uNorm - fx;
                const ddy = p.vNorm - fy;
                const dist2 = ddx * ddx + ddy * ddy;

                if (dist2 < 0.42) {
                  const dist = Math.sqrt(dist2);
                  const sinkW = Math.exp(-dist2 / dentSigma2);
                  p.ty += dentDepth * sinkW;
                  p.touchW = Math.max(p.touchW, sinkW);

                  const ringW = Math.exp(-Math.pow((dist - 0.20) / 0.11, 2));
                  if (ringW > 0.01) {
                    const horizSign = ddx / (dist + 0.045);
                    const flankFactor = Math.min(1, Math.abs(ddx) * 4.2);
                    p.tx += horizSign * bulgeHoriz * ringW;
                    p.ty -= bulgeUp * ringW * flankFactor;
                    p.touchW = Math.max(p.touchW, ringW * 0.7);
                  }
                }

                if (waveStrength > 0.02) {
                  const adx = p.uNorm - aheadX;
                  const ady = p.vNorm - aheadY;
                  const adist2 = adx * adx + ady * ady;
                  if (adist2 < 0.28) {
                    const waveW = Math.exp(-adist2 / waveSigma2);
                    p.tx += wavePushX * waveW;
                    p.ty += wavePushY * waveW;
                    p.touchW = Math.max(p.touchW, waveW * waveStrength);
                  }
                }
              }
            });
          }
        }

        /* --- B. Living / Idle Layer (Attenuated Where Touched) --- */
        const t = state.time;

        // 1) Breathing: ~3.6s period, torso/back vertices rise/fall ~1.2% of cat height
        const breathSin = Math.sin(t * ((Math.PI * 2) / 3.6));
        const breathAmp = 0.012 * H;
        const bc = reg.breathCenter;

        // 2) Autonomous tail tip sway (untouched > 2s, side/belly, ±3px, ~2.8s period)
        const idleSinceTouch = t - state.lastTouchAt;
        const tailSwayRamp = (state.pose === "side" || state.pose === "belly") && activePointers.size === 0 && idleSinceTouch > 2.0
          ? Math.min(1, (idleSinceTouch - 2.0) / 0.6)
          : 0;
        const tailSwayVal = tailSwayRamp > 0 ? Math.sin(t * ((Math.PI * 2) / 2.8)) * 3.0 * tailSwayRamp : 0;

        // 3) Random ear twitch (every 7-15s, 180ms fast pulse ~3px)
        const earElapsed = t - state.earTwitchStart;
        let earEnv = 0;
        if (earElapsed >= 0 && earElapsed < 0.18) {
          const u = earElapsed / 0.18;
          earEnv = u < 0.32 ? u / 0.32 : Math.pow(1 - (u - 0.32) / 0.68, 1.5);
        }

        // 4) Blinking (sit pose only, every 4-8s, 120ms vertical compression ~35%)
        let blinkEnv = 0;
        if (state.pose === "sit") {
          const blinkElapsed = t - state.blinkStart;
          if (blinkElapsed >= 0 && blinkElapsed < 0.12) {
            blinkEnv = Math.sin((blinkElapsed / 0.12) * Math.PI);
          }
        }

        for (let i = 0; i < meshPoints.length; i++) {
          const p = meshPoints[i];
          const idleWeight = Math.max(0, 1 - p.touchW);
          if (idleWeight <= 0.01) continue;

          // Breathing torso displacement
          const bdx = (p.uNorm - bc.x) / bc.sx;
          const bdy = (p.vNorm - bc.y) / bc.sy;
          const bDist2 = bdx * bdx + bdy * bdy;
          if (bDist2 < 4.0) {
            const bw = Math.exp(-0.5 * bDist2);
            p.ty -= breathSin * breathAmp * bw * idleWeight;
          }

          // Autonomous tail tip sway
          if (tailSwayVal !== 0 && p.uNorm > reg.tailStartX + 0.06) {
            const tipT = Math.max(0, (p.uNorm - (reg.tailStartX + 0.06)) / (1 - (reg.tailStartX + 0.06)));
            p.ty += tailSwayVal * tipT * tipT * idleWeight;
          }

          // Ear twitch impulse (~3px)
          if (earEnv > 0.005) {
            const edx = p.uNorm - state.earTwitchTarget.x;
            const edy = p.vNorm - state.earTwitchTarget.y;
            const eDist2 = edx * edx + edy * edy;
            if (eDist2 < 0.025) {
              const ew = Math.exp(-eDist2 / 0.0045);
              p.tx += 1.6 * earEnv * ew * idleWeight;
              p.ty -= 3.2 * earEnv * ew * idleWeight;
            }
          }

          // Sit pose eye-band blink (~35% vertical compression)
          if (blinkEnv > 0.005 && state.pose === "sit") {
            const yMid = (reg.eyesY[0] + reg.eyesY[1]) * 0.5;
            const dyEye = p.vNorm - yMid;
            if (Math.abs(dyEye) < 0.095 && p.uNorm > reg.eyesX[0] - 0.06 && p.uNorm < reg.eyesX[1] + 0.06) {
              const xCenter = (reg.eyesX[0] + reg.eyesX[1]) * 0.5;
              const xHalf = (reg.eyesX[1] - reg.eyesX[0]) * 0.5 + 0.05;
              const xMask = Math.max(0, 1 - Math.pow((p.uNorm - xCenter) / xHalf, 2));
              const yMask = Math.exp(-Math.pow(dyEye / 0.055, 2));
              p.ty += -dyEye * 0.35 * H * blinkEnv * xMask * yMask * idleWeight;
            }
          }
        }
      }

      function addVelocityKick(nx, ny, kvx, kvy, radius = 0.24) {
        const r2 = 2 * radius * radius;
        for (let i = 0; i < meshPoints.length; i++) {
          const p = meshPoints[i];
          if (p.slow) continue; // Keep tail on slow-recovery integrator
          const ddx = p.uNorm - nx;
          const ddy = p.vNorm - ny;
          const dist2 = ddx * ddx + ddy * ddy;
          if (dist2 < r2 * 2.5) {
            const w = Math.exp(-dist2 / r2);
            p.vx += kvx * w;
            p.vy += kvy * w;
          }
        }
      }

      function applyBristleBurst(nx, ny) {
        for (let i = 0; i < meshPoints.length; i++) {
          const p = meshPoints[i];
          if (p.slow) continue;
          const ddx = p.uNorm - nx;
          const ddy = p.vNorm - ny;
          const dist = Math.hypot(ddx, ddy);
          if (dist < 0.42) {
            const w = 1 - dist / 0.42;
            const angle = Math.atan2(ddy, ddx) + (Math.random() - 0.5) * 0.7;
            const kick = (260 + Math.random() * 190) * w;
            p.vx += Math.cos(angle) * kick;
            p.vy += Math.sin(angle) * kick - 210 * w;
          }
        }
      }

      function stepMesh(dt) {
        computeTargetDeformation();

        const tailDragging = isTailActivelyDragged();
        const tSinceRelease = state.time - state.tailReleaseAt;
        // Decaying curl bias during slow tail uncurl (~4-5s total, peak near tau=1.6s)
        let curlWave = 0;
        if (!tailDragging && state.tailCurlAmp > 0.01 && tSinceRelease >= 0 && tSinceRelease < 6.0) {
          const r = tSinceRelease / TAIL_RECOVERY_TAU;
          curlWave = r * Math.exp(1 - r) * state.tailCurlAmp;
        }

        const slowFactor = 1 - Math.exp(-dt / TAIL_RECOVERY_TAU);
        const dragFollow = 1 - Math.exp(-dt / 0.045);
        const tailStartX = POSES[state.pose].regions.tailStartX || 0.64;
        const tailSpan = Math.max(0.1, 1 - tailStartX);

        for (let i = 0; i < meshPoints.length; i++) {
          const p = meshPoints[i];

          if (p.slow) {
            // Tail vertices: fast follow while dragged, slow exponential uncurl (tau=1.6s) on release
            if (tailDragging) {
              p.dx += (p.tx - p.dx) * dragFollow;
              p.dy += (p.ty - p.dy) * dragFollow;
              p.vx = 0;
              p.vy = 0;
            } else {
              const tailT = Math.max(0, (p.uNorm - tailStartX) / tailSpan);
              const curlX = -8 * tailT * tailT * curlWave;
              const curlY = -11 * tailT * tailT * curlWave;
              const targetX = p.tx + curlX;
              const targetY = p.ty + curlY;
              p.dx += (targetX - p.dx) * slowFactor;
              p.dy += (targetY - p.dy) * slowFactor;
              p.vx = 0;
              p.vy = 0;
            }
          } else {
            // Body vertices: jelly spring physics
            const ax = SPRING_K * (p.tx - p.dx) - SPRING_DAMP * p.vx;
            const ay = SPRING_K * (p.ty - p.dy) - SPRING_DAMP * p.vy;
            p.vx += ax * dt;
            p.vy += ay * dt;
            p.dx += p.vx * dt;
            p.dy += p.vy * dt;
          }
        }

        // Spring-damped head tilt for sit pose
        const tiltAcc = 120 * (state.headTiltTarget - state.headTilt) - 13 * state.headTiltVel;
        state.headTiltVel += tiltAcc * dt;
        state.headTilt += state.headTiltVel * dt;
        state.headTiltTarget *= Math.pow(0.08, dt);
      }

      /* =========================================================
       * 6. Layered Rendering (BG -> Shadow -> Cat Mesh -> Hand -> Particles -> Night)
       * ========================================================= */
      function renderBackground() {
        const sw = state.stageW;
        const sh = state.stageH;

        if (bgAsset.loaded && bgAsset.img) {
          const iw = bgAsset.img.naturalWidth || 1920;
          const ih = bgAsset.img.naturalHeight || 1280;
          const scale = Math.max(sw / iw, sh / ih); // cover
          const dw = iw * scale;
          const dh = ih * scale;
          const dx = (sw - dw) * 0.5;
          const dy = (sh - dh) * 0.5;
          ctx.drawImage(bgAsset.img, dx, dy, dw, dh);
        } else {
          const grad = ctx.createLinearGradient(0, 0, 0, sh);
          grad.addColorStop(0, "#fdf6ea");
          grad.addColorStop(1, "#e8d8c2");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, sw, sh);
        }
      }

      function renderContactShadow(breathSin) {
        const { x, y, w, h } = state.imgBox;
        const lay = POSES[state.pose].layout;
        const cx = x + w * 0.5;
        const cy = y + h * lay.shadowY;
        const scaleBreath = 1 + breathSin * 0.022;
        const rx = w * lay.shadowRx * scaleBreath;
        const ry = Math.max(11, h * lay.shadowRy * scaleBreath);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1, ry / rx);
        const grad = ctx.createRadialGradient(0, 0, rx * 0.12, 0, 0, rx);
        grad.addColorStop(0, "rgba(28, 19, 12, 0.36)");
        grad.addColorStop(0.55, "rgba(28, 19, 12, 0.17)");
        grad.addColorStop(1, "rgba(28, 19, 12, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, rx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawTexturedTriangle(img, u0, v0, u1, v1, u2, v2, x0, y0, x1, y1, x2, y2) {
        const du1 = u1 - u0;
        const dv1 = v1 - v0;
        const du2 = u2 - u0;
        const dv2 = v2 - v0;
        const det = du1 * dv2 - du2 * dv1;
        if (Math.abs(det) < 1e-6) return;

        const dx1 = x1 - x0;
        const dy1 = y1 - y0;
        const dx2 = x2 - x0;
        const dy2 = y2 - y0;

        const a = (dx1 * dv2 - dx2 * dv1) / det;
        const b = (dy1 * dv2 - dy2 * dv1) / det;
        const c = (du1 * dx2 - du2 * dx1) / det;
        const d = (du1 * dy2 - du2 * dy1) / det;
        const e = x0 - a * u0 - c * v0;
        const f = y0 - b * u0 - d * v0;

        const cx = (x0 + x1 + x2) / 3;
        const cy = (y0 + y1 + y2) / 3;
        const pad = 0.7;
        const ex = (px, py) => {
          const vx = px - cx;
          const vy = py - cy;
          const len = Math.hypot(vx, vy) || 1;
          return [px + (vx / len) * pad, py + (vy / len) * pad];
        };
        const [p0x, p0y] = ex(x0, y0);
        const [p1x, p1y] = ex(x1, y1);
        const [p2x, p2y] = ex(x2, y2);

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(p0x, p0y);
        ctx.lineTo(p1x, p1y);
        ctx.lineTo(p2x, p2y);
        ctx.closePath();
        ctx.clip();

        ctx.transform(a, b, c, d, e, f);
        ctx.drawImage(img, 0, 0);
        ctx.restore();
      }

      function renderCatMesh(breathSin) {
        const tex = textures[state.pose];
        if (!tex) return;

        const { x, y, w, h } = state.imgBox;
        const imgW = tex.width;
        const imgH = tex.height;
        const cellOpaque = tex.cellOpaque;

        // Subtle 0.4% whole-cat breathing scale
        const breathScale = 1 + breathSin * 0.004;
        const cx = x + w * 0.5;
        const cy = y + h * 0.5;

        ctx.save();
        ctx.translate(cx, cy);
        if (state.pose === "sit") {
          ctx.rotate(state.headTilt);
        }
        ctx.scale(breathScale, breathScale);
        ctx.translate(-cx, -cy);

        const stride = GRID_COLS + 1;
        for (let r = 0; r < GRID_ROWS; r++) {
          for (let c = 0; c < GRID_COLS; c++) {
            if (cellOpaque && !cellOpaque[r * GRID_COLS + c]) continue;

            const p00 = meshPoints[r * stride + c];
            const p10 = meshPoints[r * stride + (c + 1)];
            const p01 = meshPoints[(r + 1) * stride + c];
            const p11 = meshPoints[(r + 1) * stride + (c + 1)];

            const u00 = p00.uNorm * imgW, v00 = p00.vNorm * imgH;
            const u10 = p10.uNorm * imgW, v10 = p10.vNorm * imgH;
            const u01 = p01.uNorm * imgW, v01 = p01.vNorm * imgH;
            const u11 = p11.uNorm * imgW, v11 = p11.vNorm * imgH;

            const x00 = x + p00.uNorm * w + p00.dx, y00 = y + p00.vNorm * h + p00.dy;
            const x10 = x + p10.uNorm * w + p10.dx, y10 = y + p10.vNorm * h + p10.dy;
            const x01 = x + p01.uNorm * w + p01.dx, y01 = y + p01.vNorm * h + p01.dy;
            const x11 = x + p11.uNorm * w + p11.dx, y11 = y + p11.vNorm * h + p11.dy;

            drawTexturedTriangle(tex.source, u00, v00, u10, v10, u01, v01, x00, y00, x10, y10, x01, y01);
            drawTexturedTriangle(tex.source, u10, v10, u11, v11, u01, v01, x10, y10, x11, y11, x01, y01);
          }
        }

        // Rosy blush glow during 捧脸杀 (aligned to new sit cheek coords)
        if (state.pose === "sit" && state.squishBoost > 0.02) {
          const cheeks = POSES.sit.regions.cheeks;
          ctx.globalAlpha = state.squishBoost * 0.45;
          cheeks.forEach(ch => {
            const bx = x + w * ch.x;
            const by = y + h * ch.y;
            const grad = ctx.createRadialGradient(bx, by, 3, bx, by, w * 0.13);
            grad.addColorStop(0, "#ff6b9d");
            grad.addColorStop(1, "rgba(255, 107, 157, 0)");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(bx, by, w * 0.13, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        ctx.restore();
      }

      function updateAndRenderHand(dt) {
        if (!handAsset.loaded || !handAsset.img) return;

        // Touch devices: only show while touching; mouse: fade out when outside stage or idle > 3s
        const shouldShow = handState.isTouch
          ? activePointers.size > 0
          : (handState.insideStage && (state.time - handState.lastActiveAt) <= 3.0);

        const targetAlpha = shouldShow ? 1 : 0;
        const alphaRate = shouldShow ? 12 : 6;
        handState.alpha += (targetAlpha - handState.alpha) * Math.min(1, dt * alphaRate);

        canvas.classList.toggle("hand-active", !handState.isTouch && handState.alpha > 0.15);

        if (handState.alpha < 0.01) return;

        // 90ms smooth spring lag toward pointer
        const lagFollow = 1 - Math.exp(-dt / 0.09);
        handState.x += (handState.targetX - handState.x) * lagFollow;
        handState.y += (handState.targetY - handState.y) * lagFollow;

        // Tilt toward movement direction, clamped ±35°, smoothly returning to 0
        const moveVx = (handState.targetX - handState.x) / 0.09;
        const moveVy = (handState.targetY - handState.y) / 0.09;
        const speed = Math.hypot(moveVx, moveVy);
        if (speed > 18) {
          const rawAngle = Math.atan2(-moveVx, Math.max(90, Math.abs(moveVx) * 1.15 + Math.abs(moveVy) * 0.6));
          handState.targetAngle = Math.max(-MAX_HAND_TILT, Math.min(MAX_HAND_TILT, rawAngle));
        } else {
          handState.targetAngle = 0;
        }
        handState.angle += (handState.targetAngle - handState.angle) * Math.min(1, dt * 10);

        // Press/petting scale (0.96) and 4px downward sink into fur
        const isPressed = activePointers.size > 0;
        const targetScale = isPressed ? 0.96 : 1.0;
        const targetSink = isPressed ? 4.0 : 0.0;
        handState.scale += (targetScale - handState.scale) * Math.min(1, dt * 16);
        handState.sinkY += (targetSink - handState.sinkY) * Math.min(1, dt * 16);

        // Hand size ~55% of cat body height (with sensible floor for wide side-lying crop)
        const handH = Math.max(82, state.imgBox.h * 0.55);
        const handW = handH * (handAsset.width / handAsset.height);

        // Anchor at fingertips (bottom-center of fingers-down hand cutout)
        const anchorX = handW * 0.48;
        const anchorY = handH * 0.90;

        ctx.save();
        ctx.globalAlpha = handState.alpha;
        ctx.translate(handState.x, handState.y + handState.sinkY);
        ctx.rotate(handState.angle);
        ctx.scale(handState.scale, handState.scale);
        ctx.drawImage(handAsset.img, -anchorX, -anchorY, handW, handH);
        ctx.restore();
      }

      /* =========================================================
       * 7. Particles (Hearts, Sparkles, Bristle Bolts)
       * ========================================================= */
      function spawnParticle(sx, sy, type = "heart") {
        if (particles.length > 55) particles.shift();
        const symbols = {
          heart: ["💖", "💕", "💗", "❤️"],
          spark: ["⚡", "💢"],
          star: ["✨", "🌟"]
        };
        const pool = symbols[type] || symbols.heart;
        particles.push({
          x: sx + (Math.random() - 0.5) * 24,
          y: sy + (Math.random() - 0.5) * 16,
          vx: (Math.random() - 0.5) * (type === "spark" ? 110 : 42),
          vy: type === "spark" ? -(70 + Math.random() * 80) : -(48 + Math.random() * 52),
          size: type === "spark" ? 18 + Math.random() * 8 : 16 + Math.random() * 12,
          alpha: 1,
          life: 0,
          maxLife: type === "spark" ? 0.65 : 1.15 + Math.random() * 0.35,
          symbol: pool[Math.floor(Math.random() * pool.length)],
          wobble: Math.random() * Math.PI * 2
        });
      }

      function spawnBurst(sx, sy, count = 8, type = "heart") {
        for (let i = 0; i < count; i++) {
          spawnParticle(sx, sy, type);
        }
      }

      function updateAndRenderParticles(dt) {
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life += dt;
          if (p.life >= p.maxLife) {
            particles.splice(i, 1);
            continue;
          }
          const t = p.life / p.maxLife;
          p.x += (p.vx + Math.sin(state.time * 6 + p.wobble) * 18) * dt;
          p.y += p.vy * dt;
          p.alpha = 1 - Math.pow(t, 1.8);

          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.font = `${Math.round(p.size * (0.85 + Math.sin(t * Math.PI) * 0.25))}px sans-serif`;
          ctx.fillText(p.symbol, p.x, p.y);
        }
        ctx.restore();
      }

      /* =========================================================
       * 8. Gameplay Mechanics & Feedback
       * ========================================================= */
      function showToast(msg, duration = 1500) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        if (state.toastTimer) clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => {
          toastEl.classList.remove("show");
        }, duration);
      }

      function triggerVibrate(pattern) {
        if (!state.vibrateEnabled || typeof navigator.vibrate !== "function") return;
        try {
          navigator.vibrate(pattern);
        } catch (_) {}
      }

      function addAffection(delta, sx, sy) {
        state.affection = Math.max(0, Math.min(100, state.affection + delta));
        if (delta > 0 && Math.random() < 0.24) {
          spawnParticle(sx, sy, "heart");
        }
        if (state.affection >= 100) {
          onAffectionFull();
        }
      }

      function onAffectionFull() {
        const cur = POSES[state.pose];
        state.totalHearts += 1;
        heartTotalEl.textContent = `♥ ${state.totalHearts}`;
        state.affection = 0;
        state.trap = 0;

        spawnBurst(state.stageW * 0.5, state.stageH * 0.5, 14, "heart");
        spawnBurst(state.stageW * 0.5, state.stageH * 0.5, 6, "star");
        purrAudio.playChirp("switch");
        triggerVibrate([30, 40, 45]);
        showToast(cur.switchMsg, 2200);

        switchPose(cur.next, false);
      }

      function triggerBellyGrab() {
        state.trap = 0;
        state.grabCooldown = 1.15;
        state.targetPurr = 0.08;
        state.affection = Math.max(0, state.affection - 8);

        const bc = POSES.belly.regions.bellyCenter;
        addVelocityKick(bc.x, bc.y, 0, -240, 0.34);
        applyBristleBurst(bc.x, bc.y);

        grabOverlay.classList.remove("active");
        void grabOverlay.offsetWidth;
        grabOverlay.classList.add("active");

        stageWrap.classList.remove("shake");
        void stageWrap.offsetWidth;
        stageWrap.classList.add("shake");

        purrAudio.playChirp("trap");
        triggerVibrate([45, 35, 65]);
        showToast("🐾 抓住你了！肚皮陷阱触发！", 1800);
        spawnBurst(state.stageW * 0.5, state.stageH * 0.58, 7, "spark");
      }

      function switchPose(poseId, announce = true) {
        if (!POSES[poseId]) return;
        state.pose = poseId;
        state.trap = 0;
        state.grabCooldown = 0;
        state.doubleTouchActive = false;
        resetMeshMotion();

        poseButtons.forEach(btn => {
          btn.classList.toggle("active", btn.dataset.pose === poseId);
        });
        poseTip.textContent = POSES[poseId].tip;
        trapWrap.classList.toggle("visible", poseId === "belly");

        updateStageLayout();
        syncTextureStatusUI();
        if (announce) {
          purrAudio.playChirp("switch");
          showToast(`切换姿势：${POSES[poseId].name}`, 1100);
        }
      }

      /* =========================================================
       * 9. Pointer / Multi-Touch Input & Hand Tracking
       * ========================================================= */
      function getCanvasPoint(e) {
        const rect = canvas.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        const { x, y, w, h } = state.imgBox;
        const nx = (sx - x) / w;
        const ny = (sy - y) / h;
        return { sx, sy, nx, ny };
      }

      function isInsideCat(nx, ny) {
        return nx >= -0.08 && nx <= 1.08 && ny >= -0.10 && ny <= 1.10;
      }

      canvas.addEventListener("touchstart", e => {
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener("pointerenter", e => {
        if (e.pointerType !== "touch") {
          const pt = getCanvasPoint(e);
          handState.isTouch = false;
          handState.insideStage = true;
          handState.targetX = pt.sx;
          handState.targetY = pt.sy;
          handState.x = pt.sx;
          handState.y = pt.sy;
          handState.lastActiveAt = state.time;
        }
      });

      canvas.addEventListener("pointerleave", e => {
        if (e.pointerType !== "touch") {
          handState.insideStage = false;
        }
      });

      canvas.addEventListener("pointerdown", e => {
        purrAudio.unlock();
        const pt = getCanvasPoint(e);
        state.lastTouchAt = state.time;

        handState.isTouch = e.pointerType === "touch";
        handState.insideStage = true;
        handState.targetX = pt.sx;
        handState.targetY = pt.sy;
        if (handState.alpha < 0.08) {
          handState.x = pt.sx;
          handState.y = pt.sy;
        }
        handState.lastActiveAt = state.time;

        if (!isInsideCat(pt.nx, pt.ny)) return;

        const reg = POSES[state.pose].regions;
        const isTailStart = state.pose === "side" &&
          pt.nx >= reg.tailX[0] && pt.nx <= reg.tailX[1] + 0.08 &&
          pt.ny >= 0.12 && pt.ny <= 0.96;

        activePointers.set(e.pointerId, {
          id: e.pointerId,
          sx: pt.sx,
          sy: pt.sy,
          nx: pt.nx,
          ny: pt.ny,
          startSx: pt.sx,
          startSy: pt.sy,
          anchorSx: pt.sx,
          anchorSy: pt.sy,
          dirX: 1,
          dirY: 0,
          dragMix: 0,
          lastMoveAt: state.time,
          isTailDrag: isTailStart
        });

        if (isTailStart) {
          state.tailWasDragged = true;
        } else {
          addVelocityKick(pt.nx, pt.ny, 0, state.imgBox.h * 0.48, 0.20);
        }

        if (state.pose === "sit" && activePointers.size >= 2) {
          state.doubleTouchActive = true;
          showToast("💕 捧脸杀！双倍呼噜~", 1300);
          spawnBurst(state.stageW * 0.5, state.imgBox.y + state.imgBox.h * 0.28, 6, "heart");
          purrAudio.playChirp("switch");
        }
      });

      window.addEventListener("pointermove", e => {
        const pt = getCanvasPoint(e);

        // Update hand position for mouse hover inside stage OR active pointer drag
        if (e.pointerType !== "touch") {
          if (pt.sx >= 0 && pt.sx <= state.stageW && pt.sy >= 0 && pt.sy <= state.stageH) {
            handState.isTouch = false;
            handState.insideStage = true;
            if (Math.hypot(pt.sx - handState.targetX, pt.sy - handState.targetY) > 0.6) {
              handState.lastActiveAt = state.time;
            }
            handState.targetX = pt.sx;
            handState.targetY = pt.sy;
          }
        }

        const ptr = activePointers.get(e.pointerId);
        if (!ptr) return;

        state.lastTouchAt = state.time;
        handState.targetX = pt.sx;
        handState.targetY = pt.sy;
        handState.lastActiveAt = state.time;

        const dx = pt.sx - ptr.sx;
        const dy = pt.sy - ptr.sy;
        const dist = Math.hypot(dx, dy);

        ptr.sx = pt.sx;
        ptr.sy = pt.sy;
        ptr.nx = pt.nx;
        ptr.ny = pt.ny;

        const adx = pt.sx - ptr.anchorSx;
        const ady = pt.sy - ptr.anchorSy;
        const aDist = Math.hypot(adx, ady);
        if (aDist >= 2.2) {
          const ndx = adx / aDist;
          const ndy = ady / aDist;
          ptr.dirX = ptr.dirX * 0.65 + ndx * 0.35;
          ptr.dirY = ptr.dirY * 0.65 + ndy * 0.35;
          const norm = Math.hypot(ptr.dirX, ptr.dirY) || 1;
          ptr.dirX /= norm;
          ptr.dirY /= norm;
          ptr.anchorSx = pt.sx;
          ptr.anchorSy = pt.sy;
          ptr.dragMix = Math.min(1, ptr.dragMix + 0.35);
          ptr.lastMoveAt = state.time;
        }

        if (dist < 0.8) return;

        const reg = POSES[state.pose].regions;

        // Pose 1: Side-lying
        if (state.pose === "side") {
          if (ptr.isTailDrag) {
            const pullDist = Math.hypot(pt.sx - ptr.startSx, pt.sy - ptr.startSy);
            if (pullDist > 26 && state.time - state.lastToastAt > 1.8) {
              state.lastToastAt = state.time;
              showToast("🐱 哎呀，别拽尾巴尖啦~", 1100);
            }
            return;
          }

          addVelocityKick(pt.nx, pt.ny, dx * 4.2, dy * 3.6, 0.18);

          // Updated side back zone (head x0.01-0.20, back y0.10-0.35 + generous body stroke height)
          const onBack = pt.nx >= reg.backX[0] && pt.nx <= reg.backX[1] && pt.ny >= reg.backY[0] && pt.ny <= 0.72;
          if (onBack && Math.abs(dx) > Math.abs(dy) * 0.55) {
            if (dx > 0.5) {
              const gain = Math.min(2.4, dist * 0.055);
              state.targetPurr = Math.min(1, state.targetPurr + dist * 0.015);
              addAffection(gain, pt.sx, pt.sy);
            } else if (dx < -1.4) {
              state.targetPurr = Math.max(0, state.targetPurr - 0.12);
              state.affection = Math.max(0, state.affection - dist * 0.032);
              if (state.bristleCooldown <= 0) {
                state.bristleCooldown = 0.7;
                applyBristleBurst(pt.nx, pt.ny);
                spawnBurst(pt.sx, pt.sy, 5, "spark");
                purrAudio.playBristle();
                triggerVibrate([25, 25, 25]);
                showToast("⚡ 逆毛啦！猫咪炸毛了！", 1200);
              }
            }
          } else {
            state.targetPurr = Math.min(0.65, state.targetPurr + dist * 0.007);
            addAffection(dist * 0.018, pt.sx, pt.sy);
          }
          return;
        }

        // Pose 2: Belly-up
        if (state.pose === "belly") {
          addVelocityKick(pt.nx, pt.ny, dx * 4.5, dy * 4.2, 0.20);
          if (state.grabCooldown > 0) return;

          const onBelly = pt.nx >= reg.bellyX[0] && pt.nx <= reg.bellyX[1] &&
                          pt.ny >= reg.bellyY[0] && pt.ny <= reg.bellyY[1];
          if (onBelly) {
            state.targetPurr = Math.min(1, state.targetPurr + dist * 0.016);
            addAffection(Math.min(2.2, dist * 0.048), pt.sx, pt.sy);
            state.trap = Math.min(100, state.trap + dist * 0.095);

            if (state.trap > 55 && state.trap < 62 && state.time - state.lastToastAt > 1.8) {
              state.lastToastAt = state.time;
              showToast("👀 肚皮好软…但后脚好像在蓄力", 1200);
            }
            if (state.trap >= 100) {
              triggerBellyGrab();
            }
          } else {
            state.targetPurr = Math.min(0.75, state.targetPurr + dist * 0.008);
            addAffection(dist * 0.024, pt.sx, pt.sy);
          }
          return;
        }

        // Pose 3: Sitting front
        if (state.pose === "sit") {
          if (activePointers.size >= 2) {
            state.doubleTouchActive = true;
            const pts = Array.from(activePointers.values());
            state.targetPurr = Math.min(1, state.targetPurr + dist * 0.026);
            addAffection(Math.min(3.6, dist * 0.09), pt.sx, pt.sy);
            if (Math.random() < 0.38) {
              spawnParticle((pts[0].sx + pts[1].sx) * 0.5, (pts[0].sy + pts[1].sy) * 0.5, "heart");
            }
          } else {
            addVelocityKick(pt.nx, pt.ny, dx * 3.8, dy * 3.5, 0.18);
            const onFace = pt.nx >= reg.faceX[0] && pt.nx <= reg.faceX[1] &&
                           pt.ny >= reg.faceY[0] && pt.ny <= reg.faceY[1];
            if (onFace) {
              const tiltDelta = (dx / state.stageW) * 1.1;
              state.headTiltTarget = Math.max(-0.24, Math.min(0.24, state.headTiltTarget + tiltDelta));
              state.targetPurr = Math.min(1, state.targetPurr + dist * 0.015);
              addAffection(Math.min(2.2, dist * 0.052), pt.sx, pt.sy);
            } else {
              state.targetPurr = Math.min(0.7, state.targetPurr + dist * 0.007);
              addAffection(dist * 0.02, pt.sx, pt.sy);
            }
          }
        }
      });

      function onPointerEnd(e) {
        if (!activePointers.has(e.pointerId)) return;
        const p = activePointers.get(e.pointerId);
        if (p && p.isTailDrag) {
          // Trigger slow uncurl recovery (~4-5s) with slight curl bias
          const pullMag = Math.hypot(p.sx - p.startSx, p.sy - p.startSy);
          state.tailReleaseAt = state.time;
          state.tailCurlAmp = Math.min(1.4, pullMag / 70);
        }
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) {
          state.doubleTouchActive = false;
        }
      }

      window.addEventListener("pointerup", onPointerEnd);
      window.addEventListener("pointercancel", onPointerEnd);

      /* =========================================================
       * 10. UI Controls & Stage Layout (Cat Centered on Lower-Middle Mat)
       * ========================================================= */
      function updateStageLayout() {
        const rect = stageWrap.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
        state.stageW = Math.max(200, rect.width);
        state.stageH = Math.max(200, rect.height);

        canvas.width = Math.round(state.stageW * dpr);
        canvas.height = Math.round(state.stageH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const tex = textures[state.pose];
        const lay = POSES[state.pose].layout;
        const aspect = tex ? tex.width / tex.height : 1;
        const padW = state.stageW * lay.padW;
        const padH = state.stageH * lay.padH;

        let drawW = padW;
        let drawH = drawW / aspect;
        if (drawH > padH) {
          drawH = padH;
          drawW = drawH * aspect;
        }

        const x = (state.stageW - drawW) * 0.5;
        let y = state.stageH * lay.centerY - drawH * 0.5;
        y = Math.max(state.stageH * 0.08, Math.min(state.stageH * 0.94 - drawH, y));

        state.imgBox = { x, y, w: drawW, h: drawH };
      }

      poseButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          purrAudio.unlock();
          switchPose(btn.dataset.pose, true);
        });
      });

      btnTheme.addEventListener("click", () => {
        state.nightMode = !state.nightMode;
        document.body.classList.toggle("night", state.nightMode);
        btnTheme.textContent = state.nightMode ? "🌙" : "☀️";
      });

      btnAudio.addEventListener("click", () => {
        purrAudio.unlock();
        state.audioMuted = !state.audioMuted;
        btnAudio.textContent = state.audioMuted ? "🔇" : "🔊";
        btnAudio.classList.toggle("muted", state.audioMuted);
      });

      btnVibrate.addEventListener("click", () => {
        state.vibrateEnabled = !state.vibrateEnabled;
        btnVibrate.classList.toggle("muted", !state.vibrateEnabled);
        if (state.vibrateEnabled) triggerVibrate(20);
      });

      window.addEventListener("resize", updateStageLayout);

      /* =========================================================
       * 11. Main 60fps Loop
       * ========================================================= */
      let lastTs = performance.now();

      function tick(now) {
        const dt = Math.min(0.033, Math.max(0.001, (now - lastTs) / 1000));
        lastTs = now;
        state.time += dt;

        if (state.grabCooldown > 0) state.grabCooldown = Math.max(0, state.grabCooldown - dt);
        if (state.bristleCooldown > 0) state.bristleCooldown = Math.max(0, state.bristleCooldown - dt);

        // Schedule random ear twitch (every 7-15s)
        if (state.time >= state.nextEarTwitchAt) {
          const ears = POSES[state.pose].regions.ears;
          state.earTwitchTarget = ears[Math.floor(Math.random() * ears.length)];
          state.earTwitchStart = state.time;
          state.nextEarTwitchAt = state.time + 7 + Math.random() * 8;
        }

        // Schedule sit-pose blink (every 4-8s)
        if (state.time >= state.nextBlinkAt) {
          if (state.pose === "sit") {
            state.blinkStart = state.time;
          }
          state.nextBlinkAt = state.time + 4 + Math.random() * 4;
        }

        // Relax drag wave when finger holds still (press dent stays!)
        activePointers.forEach(ptr => {
          if (state.time - ptr.lastMoveAt > 0.14) {
            ptr.dragMix = Math.max(0, ptr.dragMix - dt * 2.8);
          }
        });

        // Two-finger 捧脸杀 sustained boost
        if (state.pose === "sit" && activePointers.size >= 2) {
          const pts = Array.from(activePointers.values());
          state.targetPurr = Math.min(1, state.targetPurr + dt * 0.45);
          addAffection(dt * 12, (pts[0].sx + pts[1].sx) * 0.5, (pts[0].sy + pts[1].sy) * 0.5);
          state.squishBoost = Math.min(1, state.squishBoost + dt * 4);
        } else {
          state.squishBoost = Math.max(0, state.squishBoost - dt * 3);
        }

        // Decay purr & belly trap when untouched
        if (activePointers.size === 0) {
          state.targetPurr = Math.max(0, state.targetPurr - dt * 0.30);
          if (state.pose === "belly" && state.trap > 0) {
            state.trap = Math.max(0, state.trap - dt * 6);
          }
        }
        state.purr += (state.targetPurr - state.purr) * Math.min(1, dt * 7);

        // Update AudioBuffer purr & optional Android vibration
        purrAudio.update(state.purr, state.audioMuted);
        if (state.purr > 0.22 && now - state.lastVibrateAt > (390 - state.purr * 140)) {
          state.lastVibrateAt = now;
          triggerVibrate(Math.round(14 + state.purr * 18));
        }

        // Step mesh physics
        stepMesh(dt);

        // Update HUD DOM
        affectionFill.style.width = `${state.affection.toFixed(1)}%`;
        affectionLabel.textContent = `${Math.round(state.affection)}%`;

        if (state.pose === "belly") {
          trapFill.style.width = `${state.trap.toFixed(1)}%`;
          trapLabel.textContent =
            state.trap < 35 ? "安全享受中" :
            state.trap < 75 ? "尾巴开始甩了…" : "危险！快收手！";
        }

        const pulseScale = 0.75 + state.purr * 0.55 + Math.sin(state.time * 18) * state.purr * 0.14;
        purrDot.style.transform = `scale(${pulseScale.toFixed(2)})`;
        purrDot.style.background = state.doubleTouchActive ? "var(--pink)" : "var(--accent)";
        if (state.doubleTouchActive) {
          purrText.textContent = "捧脸杀 · 双倍呼噜中";
        } else if (state.purr > 0.55) {
          purrText.textContent = "呼噜呼噜~~~ 超满足";
        } else if (state.purr > 0.18) {
          purrText.textContent = "微微呼噜中…";
        } else {
          purrText.textContent = "轻抚猫咪开始呼噜";
        }

        // Layered Render Pipeline (BG never deforms)
        const breathSin = Math.sin(state.time * ((Math.PI * 2) / 3.6));
        ctx.clearRect(0, 0, state.stageW, state.stageH);
        renderBackground();
        renderContactShadow(breathSin);
        renderCatMesh(breathSin);
        updateAndRenderHand(dt);
        updateAndRenderParticles(dt);

        // Night mode overlay on top of entire scene + cat + hand
        if (state.nightMode) {
          ctx.fillStyle = "rgba(18, 28, 72, 0.38)";
          ctx.fillRect(0, 0, state.stageW, state.stageH);
        }

        requestAnimationFrame(tick);
      }

      /* =========================================================
       * 12. Boot
       * ========================================================= */
      initMesh();
      tagTailVerticesForPose();
      loadAllAssets();
      updateStageLayout();
      syncTextureStatusUI();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
